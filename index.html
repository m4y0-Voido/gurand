<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Task Rogue (タスク連動ローグライク)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #0d1117; color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px; background: #161b22;
            border: 4px solid #30363d; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* タブ切り替え */
        #tab-bar { display: flex; background: #21262d; border-bottom: 2px solid #30363d; }
        .tab-btn { flex: 1; background: none; border: none; color: #8b949e; padding: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .tab-btn.active { color: #58a6ff; border-bottom: 3px solid #58a6ff; background: #161b22; }

        .view-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 15px; gap: 15px; }
        .hidden { display: none !important; }

        /* --- ステータスUI --- */
        #r-hud {
            background: #21262d; padding: 10px 15px; font-size: 12px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
            border-bottom: 1px solid #30363d;
        }
        .stat-growth { color: #7ee787; font-weight: bold; }

        /* --- ダンジョン画面 --- */
        #stage-container { flex: 1; background: #050505; display: flex; justify-content: center; align-items: center; position: relative; }
        #grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(12, 1fr); width: 340px; height: 340px; background: #111; border: 2px solid #333; }
        .cell { display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; }
        .wall { background: #222; color: #444; }
        .floor { background: #0a0a0a; color: #1a1a1a; }

        /* --- コントローラー --- */
        #controls { padding: 10px; background: #222; display: flex; justify-content: center; }
        .pad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 150px; }
        .btn { background: #444; border: none; color: #fff; font-size: 18px; font-weight: bold; padding: 12px 0; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn:active { background: #555; }

        /* --- タスク管理画面 --- */
        #task-creator { background: #21262d; padding: 12px; border-radius: 8px; border: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
        #task-input { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px; border-radius: 6px; font-size: 14px; outline: none; }
        .task-item { background: #21262d; border: 1px solid #30363d; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-complete { background: #238636; font-size: 12px; padding: 6px 12px; }

        /* メッセージログ */
        #log-window { height: 60px; background: #0d1117; padding: 5px 10px; font-size: 11px; color: #aaa; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-top: 1px solid #30363d;}

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
    </style>
</head>
<body>

<div id="phone-shell">
    <!-- タブバー -->
    <div id="tab-bar">
        <button id="tab-task" class="tab-btn active" onclick="switchTab('task')">📋 クエスト（現実）</button>
        <button id="tab-dungeon" class="tab-btn" onclick="switchTab('dungeon')">👺 ダンジョン（ゲーム）</button>
    </div>

    <!-- ================= タスク画面 ================= -->
    <div id="view-task" class="view-content">
        <div style="font-size: 12px; color: #8b949e;">💡 現実のタスクを登録・完了して、あなたのキャラクターを永久に強くしましょう！</div>
        
        <div id="task-creator">
            <input type="text" id="task-input" placeholder="やらないといけないことを入力..." maxlength="25">
            <button class="btn" style="background:#1f6feb; font-size:14px; padding:8px;" onclick="addTask()">タスクを受注する</button>
        </div>

        <div style="font-weight:bold; font-size:14px; margin-top:10px;">現在の受注リスト</div>
        <div id="task-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <!-- ================= ダンジョン画面 ================= -->
    <div id="view-dungeon" class="view-content hidden" style="padding:0;">
        <!-- HUD -->
        <div id="r-hud">
            <div>階層: <span id="ui-floor">1</span> F</div>
            <div>満腹度: <span id="ui-satiety">100</span> %</div>
            <div>HP: <span id="ui-hp">20</span> / <span id="ui-max-hp">20</span></div>
            <div>基礎攻撃力: <span id="ui-atk" class="stat-growth">3</span></div>
        </div>

        <!-- マップ -->
        <div id="stage-container">
            <div id="grid"></div>
            <div id="overlay" class="hidden">
                <h1 id="over-title" style="color:#ff3333; margin-bottom:10px;">冒険失敗</h1>
                <p id="over-desc" style="font-size:12px; text-align:center; color:#aaa; margin-bottom:15px;"></p>
                <button class="btn" style="background:#ff3333; width:120px;" onclick="respawnPlayer()">街へ戻る</button>
            </div>
        </div>

        <!-- ログ -->
        <div id="log-window"></div>

        <!-- パッド -->
        <div id="controls">
            <div class="pad-grid">
                <div></div><button class="btn" onclick="movePlayer(0, -1)">▲</button><div></div>
                <button class="btn" onclick="movePlayer(-1, 0)">◀</button>
                <button class="btn" onclick="movePlayer(0, 0)" style="font-size:12px; background:#333;">パス</button>
                <button class="btn" onclick="movePlayer(1, 0)">▶</button>
                <div></div><button class="btn" onclick="movePlayer(0, 1)">▼</button><div></div>
            </div>
        </div>
    </div>
</div>

<script>
    const WIDTH = 12; const HEIGHT = 12;

    // プレイヤー基礎ステータス（現実のタスクをクリアすると「永久に」育つ）
    let growth = {
        maxHp: 20,
        atk: 3,
        savedSatiety: 100 // タスククリアでストックが溜まる
    };

    // 現在のダンジョン内の一時ステータス
    let player = { x: 1, y: 1, hp: 20, satiety: 100 };
    let currentFloor = 1;
    let dungeonMap = [];
    let enemies = [];
    let isGameOver = false;
    let tasks = [];

    const ICONS = { player: "🤠", wall: "■", floor: "·", stair: "▰", enemy: "🟢" };

    // --- タブ切り替え ---
    function switchTab(type) {
        document.getElementById('tab-task').classList.remove('active');
        document.getElementById('tab-dungeon').classList.remove('active');
        document.getElementById('view-task').classList.add('hidden');
        document.getElementById('view-dungeon').classList.add('hidden');

        if(type === 'task') {
            document.getElementById('tab-task').classList.add('active');
            document.getElementById('view-task').classList.remove('hidden');
        } else {
            document.getElementById('tab-dungeon').classList.add('active');
            document.getElementById('view-dungeon').classList.remove('hidden');
            // ダンジョンが始まっていなければ初期化
            if(dungeonMap.length === 0) { enterDungeon(); }
        }
    }

    // ================= 現実のタスク管理ロジック =================
    function addTask() {
        const input = document.getElementById('task-input');
        if(!input.value.trim()) return;

        tasks.push({ id: Date.now(), text: input.value.trim() });
        input.value = "";
        renderTasks();
    }

    function completeTask(id) {
        const idx = tasks.findIndex(t => t.id === id);
        if(idx === -1) return;

        // キャラクターの永久成長（バフ）
        if(Math.random() > 0.5) {
            growth.maxHp += 2;
            alert(`【タスク完了！】現実の努力が身を結んだ！\n最大HPが永久に +2 された！`);
        } else {
            growth.atk += 1;
            alert(`【タスク完了！】現実の努力が身を結んだ！\n基礎攻撃力が永久に +1 された！`);
        }
        
        // 満腹度のストックを追加
        growth.savedSatiety = Math.min(200, growth.savedSatiety + 30);
        
        // もしダンジョン中なら即座にステータスへ反映
        player.hp = Math.min(growth.maxHp, player.hp + 5); 
        player.satiety = Math.min(200, player.satiety + 30);

        tasks.splice(idx, 1);
        renderTasks();
        updateUI();
    }

    function renderTasks() {
        const list = document.getElementById('task-list');
        list.innerHTML = "";
        if(tasks.length === 0) {
            list.innerHTML = `<div style="text-align:center; color:#8b949e; font-size:12px; padding:20px;">受注中のタスクはありません。<br>やるべきことを上から入力して登録しましょう！</div>`;
            return;
        }
        tasks.forEach(t => {
            const item = document.createElement('div');
            item.classList.add('task-item');
            item.innerHTML = `<span>${t.text}</span><button class="btn btn-complete" onclick="completeTask(${t.id})">完了(討伐)</button>`;
            list.appendChild(item);
        });
    }

    // ================= ローグライクゲームロジック =================
    function enterDungeon() {
        // 現在の成長具合をダンジョン内ステータスに同期
        player.hp = growth.maxHp;
        player.satiety = growth.savedSatiety;
        currentFloor = 1;
        isGameOver = false;
        document.getElementById('overlay').classList.add('hidden');
        addLog("--- ダンジョンに潜入した ---");
        generateFloor();
    }

    function generateFloor() {
        dungeonMap = []; enemies = [];
        for (let y = 0; y < HEIGHT; y++) {
            dungeonMap[y] = [];
            for (let x = 0; x < WIDTH; x++) {
                if (x === 0 || x === WIDTH - 1 || y === 0 || y === HEIGHT - 1) dungeonMap[y][x] = 'wall';
                else dungeonMap[y][x] = (Math.random() < 0.18) ? 'wall' : 'floor';
            }
        }
        player.x = 1; player.y = 1;
        dungeonMap[1][1] = 'floor';
        dungeonMap[HEIGHT - 2][WIDTH - 2] = 'stair'; // 階段

        // 敵の配置
        let count = 1 + Math.floor(currentFloor / 2);
        for(let i=0; i<count; i++) {
            let rx = Math.floor(Math.random() * (WIDTH-2))+1;
            let ry = Math.floor(Math.random() * (HEIGHT-2))+1;
            if(dungeonMap[ry][rx] === 'floor' && !(rx===1 && ry===1)) {
                enemies.push({ x: rx, y: ry, hp: 4 + currentFloor, atk: 2 + currentFloor });
            }
        }
        updateUI(); drawMap();
    }

    function drawMap() {
        const grid = document.getElementById('grid'); grid.innerHTML = '';
        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                const cell = document.createElement('div'); cell.classList.add('cell');
                if (dungeonMap[y][x] === 'wall') { cell.classList.add('wall'); cell.innerText = ICONS.wall; }
                else { cell.classList.add('floor'); cell.innerText = ICONS.floor; }
                if (dungeonMap[y][x] === 'stair') cell.innerText = ICONS.stair;

                let e = enemies.find(en => en.x === x && en.y === y);
                if (e) cell.innerText = ICONS.enemy;
                if (player.x === x && player.y === y) cell.innerText = ICONS.player;

                grid.appendChild(cell);
            }
        }
    }

    function movePlayer(dx, dy) {
        if(isGameOver) return;
        let nx = player.x + dx; let ny = player.y + dy;
        if(dungeonMap[ny][nx] === 'wall') return;

        // 寿命（満腹度）消費
        if(dx !== 0 || dy !== 0) {
            player.satiety = Math.max(0, player.satiety - 1);
            growth.savedSatiety = player.satiety; // 現実タブにもストックをリアルタイム同期
            if(player.satiety <= 0) {
                player.hp = Math.max(0, player.hp - 1);
                addLog("飢えでダメージを受けた！タスクを完了せよ！", true);
            }
        }

        // 戦闘
        let enemy = enemies.find(e => e.x === nx && e.y === ny);
        if(enemy) {
            enemy.hp -= growth.atk;
            addLog(`敵に ${growth.atk} のダメージを与えた！`);
            if(enemy.hp <= 0) {
                addLog("敵を撃破！");
                enemies = enemies.filter(e => e !== enemy);
            }
            enemyTurn(); checkDeath(); updateUI(); drawMap();
            return;
        }

        player.x = nx; player.y = ny;

        if(dungeonMap[player.y][player.x] === 'stair') {
            currentFloor++;
            addLog(`階段を下りた... ${currentFloor}F`);
            generateFloor();
            return;
        }

        enemyTurn(); checkDeath(); updateUI(); drawMap();
    }

    function enemyTurn() {
        enemies.forEach(e => {
            let dx = player.x - e.x; let dy = player.y - e.y;
            if(Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && (Math.abs(dx)+Math.abs(dy)===1)) {
                player.hp = Math.max(0, player.hp - e.atk);
                addLog(`敵から ${e.atk} のダメージを受けた！`, true);
            } else {
                // 簡易接近
                let mx = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                let my = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                let tx = e.x + (Math.abs(dx) > Math.abs(dy) ? mx : 0);
                let ty = e.y + (Math.abs(dx) > Math.abs(dy) ? 0 : my);
                if(dungeonMap[ty][tx] !== 'wall' && !enemies.some(en => en.x === tx && en.y === ty)) {
                    e.x = tx; e.y = ty;
                }
            }
        });
    }

    function checkDeath() {
        if(player.hp <= 0) {
            isGameOver = true;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('over-title').innerText = "力尽きた";
            document.getElementById('over-desc').innerText = `到達階層: ${currentFloor}F\nダンジョンの進行度はリセットされますが、\n現実のタスクで得た基礎能力（HP:${growth.maxHp}/ATK:${growth.atk}）は失われません！`;
        }
    }

    function respawnPlayer() {
        enterDungeon();
    }

    function updateUI() {
        document.getElementById('ui-floor').innerText = currentFloor;
        document.getElementById('ui-satiety').innerText = player.satiety;
        document.getElementById('ui-hp').innerText = player.hp;
        document.getElementById('ui-max-hp').innerText = growth.maxHp;
        document.getElementById('ui-atk').innerText = growth.atk;
    }

    function addLog(txt, dng = false) {
        const win = document.getElementById('log-window');
        const item = document.createElement('div');
        if(dng) item.style.color = "#ff4d4d";
        item.innerText = txt;
        win.appendChild(item);
        if(win.children.length > 3) win.removeChild(win.children[0]);
    }

    // キーボード
    window.addEventListener('keydown', (e) => {
        if(document.getElementById('view-dungeon').classList.contains('hidden')) return;
        if(e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
        if(e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
        if(e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
        if(e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
        if(e.key === ' ') movePlayer(0, 0);
    });

    // 初回起動
    renderTasks();
</script>
</body>
</html>
