<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>オート電撃サバイバー: 極限ビルド(調整版)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #05070a; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px; background: #0b0f19;
            border: 4px solid #1f293d; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,255,255,0.1);
        }
        #hud {
            padding: 12px 15px; background: #060911; border-bottom: 2px solid #1f293d;
            display: flex; justify-content: space-between; align-items: center; font-family: monospace;
        }
        #time-box { font-size: 18px; color: #00ffff; font-weight: bold; }
        #lv-box { font-size: 14px; color: #ffcc00; }

        #exp-container { width: 100%; height: 6px; background: #1a2233; position: relative; }
        #exp-fill { height: 100%; background: #00ff66; width: 0%; transition: width 0.1s; }

        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #0f172a 0%, #05070a 100%); }
        canvas { display: block; width: 100%; height: 100%; }

        /* ビルド・神器化選択画面 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.95); z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; gap: 15px;
        }
        .overlay-title { font-size: 26px; color: #ffcc00; font-weight: bold; text-shadow: 0 0 10px rgba(255,204,0,0.5); text-align: center; }
        .overlay-subtitle { font-size: 13px; color: #a855f7; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 5px rgba(168,85,247,0.5); }
        .card {
            width: 100%; background: #111827; border: 2px solid #374151; padding: 15px; border-radius: 12px;
            cursor: pointer; display: flex; flex-direction: column; gap: 4px;
            transition: transform 0.1s, border-color 0.2s;
        }
        .card:hover { border-color: #00ffff; }
        .card.shingi { border-color: #a855f7; background: #1e1b4b; }
        .card.shingi:hover { border-color: #d8b4fe; }
        .card:active { transform: scale(0.97); }
        .card-name { font-size: 17px; font-weight: bold; color: #fff; }
        .card-desc { font-size: 13px; color: #9ca3af; }
        .card-buff { color: #00ff66; font-weight: bold; }
        .card-nerf { color: #ef4444; font-weight: bold; }

        /* ゲームオーバー画面 */
        #gameover-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 5, 5, 0.95); z-index: 30;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px;
        }
        .go-title { font-size: 36px; color: #ef4444; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
        .btn-restart { background: #ef4444; border: none; color: #fff; padding: 12px 35px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="phone-shell">
    <div id="hud">
        <div id="time-box">00:00</div>
        <div id="lv-box">Lv.1</div>
    </div>
    <div id="exp-container"><div id="exp-fill"></div></div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>

        <!-- 選択用オーバーレイ（通常ビルド & 神器化共通） -->
        <div id="overlay" class="hidden">
            <div id="overlay-main-title" class="overlay-title">LEVEL UP!!</div>
            <div id="overlay-sub-title" class="overlay-subtitle"></div>
            <div id="options-container" style="width:100%; display:flex; flex-direction:column; gap:12px;"></div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-overlay" class="hidden">
            <div class="go-title">防衛ライン突破・大破</div>
            <p id="ui-result-text" style="color:#9ca3af; font-size:14px; text-align:center; line-height:1.6;"></p>
            <button class="btn-restart" onclick="initGame()">リベンジする</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPaused = false;
    let isGameOver = false;
    let gameTime = 0;
    let frameCount = 0;

    // プレイヤー・ビルドステータス
    let player = {
        x: 0, y: 0, radius: 15,
        hp: 100, maxHp: 100,
        level: 1, exp: 0, maxExp: 10,
        
        // 進化ビルドパラメータ
        atkSpdMultiplier: 1.0,   // 攻撃速度倍率
        atkPowerMultiplier: 1.0, // 攻撃力倍率
        shootCount: 1,             // 同時発射数
        pierceCount: 1,            // 貫通力
    };

    // 通常ビルドマスター
    const BUILDS = [
        { type: 'speed', name: "クイックチャージ", desc: "攻撃速度がさらに +10% 加速" },
        { type: 'power', name: "リミットフォース", desc: "攻撃力がさらに +10% 上昇" },
        { type: 'count', name: "追加バレル", desc: "一度に攻撃できる電撃の数が +1 本" },
        { type: 'pierce', name: "ライトニング連鎖", desc: "電撃の敵を貫通・連鎖する数が +1 体" },
        { type: 'heal', name: "ナノ修復システム", desc: "体力をランダム(30~100) + 減少HPの5%分 回復" }
    ];

    // 神器化マスター
    const SHINGI = [
        { id: 1, name: "神器：迅雷の極意", desc: "圧倒的な超連射力を得るが、一撃の威力が軽くなる", buff: "攻撃速度 +120%", nerf: "攻撃力 -70%", action: () => { player.atkSpdMultiplier += 1.2; player.atkPowerMultiplier = Math.max(0.1, player.atkPowerMultiplier - 0.7); } },
        { id: 2, name: "神器：爆裂の巨砲", desc: "一撃必殺の超絶火力を得るが、次の装填に時間がかかる", buff: "攻撃力 +100%", nerf: "攻撃速度 -70%", action: () => { player.atkPowerMultiplier += 1.0; player.atkSpdMultiplier = Math.max(0.1, player.atkSpdMultiplier - 0.7); } },
        { id: 3, name: "神器：千手観音の裁き", desc: "画面全域を覆い尽くす無数の電撃を放つが、全体性能が低下", buff: "攻撃数 +10", nerf: "攻撃力 -30% / 攻撃速度 -30%", action: () => { player.shootCount += 10; player.atkPowerMultiplier = Math.max(0.1, player.atkPowerMultiplier - 0.3); player.atkSpdMultiplier = Math.max(0.1, player.atkSpdMultiplier - 0.3); } }
    ];

    let enemies = [];
    let gems = [];
    let beams = [];
    let lastAttackTime = 0;

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height - 40; // 防衛ライン付近
    }
    window.addEventListener('resize', resize);
    resize();

    function initGame() {
        isGameOver = false;
        isPaused = false;
        gameTime = 0;
        frameCount = 0;
        lastAttackTime = 0;
        enemies = []; gems = []; beams = [];

        player.hp = 100; player.maxHp = 100;
        player.level = 1; player.exp = 0; player.maxExp = 10;
        
        player.atkSpdMultiplier = 1.0;
        player.atkPowerMultiplier = 1.0;
        player.shootCount = 1;
        player.pierceCount = 1;

        document.getElementById('gameover-overlay').classList.add('hidden');
        document.getElementById('overlay').classList.add('hidden');
        updateUI();
    }

    function spawnEnemies() {
        // 【出現率40%低下調整】元コードの45フレーム間隔から約65フレームに引き上げ、さらに基礎湧き数をマイルド化
        if (frameCount % 65 === 0) { 
            let spawnCount = 1 + Math.floor(gameTime / 25); // 湧き増加のペースも少し緩やかに
            
            // 初期の敵出現数を抑える調整（確率的な40%オフフィルター）
            if (gameTime < 30 && Math.random() < 0.4) {
                return; 
            }

            for (let i = 0; i < spawnCount; i++) {
                let isBoss = (gameTime > 0 && gameTime % 30 === 0 && i === 0);
                enemies.push({
                    x: Math.random() * (canvas.width - 30) + 15,
                    y: -20 - (Math.random() * 60),
                    radius: isBoss ? 18 : 7,
                    hp: isBoss ? 50 + (gameTime * 3) : 2 + Math.floor(gameTime / 12),
                    maxHp: isBoss ? 50 + (gameTime * 3) : 2 + Math.floor(gameTime / 12),
                    // 【スピード30%低下調整】敵の移動速度を 0.7倍(30%減) に変更
                    speed: (isBoss ? 0.7 : 1.3 + (Math.random() * 0.5)) * 0.7,
                    isBoss: isBoss
                });
            }
        }
    }

    // オートターゲット＆貫通連鎖攻撃
    function autoAttack() {
        let now = performance.now();
        // 攻撃速度の基本値。こちらも全体速度調整に合わせ、クールダウン下限などを調整
        let attackCooldown = Math.max(110, 600 / player.atkSpdMultiplier);

        if (now - lastAttackTime > attackCooldown) {
            if (enemies.length === 0) return;

            lastAttackTime = now;
            let damage = Math.ceil(4 * player.atkPowerMultiplier);

            // プレイヤーに近い敵順にソート
            let targets = [...enemies].map(e => {
                let dx = e.x - player.x; let dy = e.y - player.y;
                return { enemy: e, dist: Math.sqrt(dx*dx + dy*dy) };
            }).sort((a, b) => a.dist - b.dist);

            // 同時発射数の数だけ、最初の「起点ターゲット」を決定
            let shootNum = Math.min(player.shootCount, targets.length);

            for (let i = 0; i < shootNum; i++) {
                let rootEnemy = targets[i].enemy;
                
                // 貫通（連鎖）処理の実行
                executeLightningChain(rootEnemy, damage, player.pierceCount);
            }

            // 死亡した敵の除外とオーブドロップ
            enemies.forEach(e => {
                if (e.hp <= 0) {
                    gems.push({ x: e.x, y: e.y, isCollected: false });
                }
            });
            enemies = enemies.filter(e => e.hp > 0);
        }
    }

    // 電撃の貫通・連鎖アルゴリズム
    function executeLightningChain(startEnemy, damage, maxChain) {
        let currentChain = 0;
        let lastX = player.x;
        let lastY = player.y;
        let currentTarget = startEnemy;
        let visited = new Set();

        while (currentTarget && currentChain < maxChain) {
            currentTarget.hp -= damage;
            visited.add(currentTarget);

            // ビームの軌跡を登録（全体の速度感に合わせて寿命を少し長めに調整）
            beams.push({
                sx: lastX, sy: lastY,
                tx: currentTarget.x, ty: currentTarget.y,
                life: 8 
            });

            lastX = currentTarget.x;
            lastY = currentTarget.y;
            currentChain++;

            if (currentChain >= maxChain) break;

            // 次の連鎖先（一番近いまだ感電していない敵）を探索
            let nextTarget = null;
            let minDist = 180; 

            for (let j = 0; j < enemies.length; j++) {
                let potential = enemies[j];
                if (potential.hp > 0 && !visited.has(potential)) {
                    let edx = potential.x - lastX;
                    let edy = potential.y - lastY;
                    let edist = Math.sqrt(edx*edx + edy*edy);
                    if (edist < minDist) {
                        minDist = edist;
                        nextTarget = potential;
                    }
                }
            }
            currentTarget = nextTarget;
        }
    }

    function update() {
        if (isPaused || isGameOver) return;

        frameCount++;
        if (frameCount % 60 === 0) {
            gameTime++;
            updateUI();
        }

        spawnEnemies();
        autoAttack();

        // 敵の移動と最下部デッドライン判定
        enemies.forEach(e => {
            e.y += e.speed;

            // プレイヤーより下（防衛線）を少しでも越えたら即死
            if (e.y + e.radius >= player.y + player.radius) {
                endGame(`敵が防衛デッドラインを突破しました。`);
            }
        });

        // 経験値オーブの完全自動吸い寄せ回収
        gems.forEach(g => {
            let dx = player.x - g.x; let dy = player.y - g.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            // 【スピード30%低下調整】吸い寄せスピードも 0.7倍（30%減）に
            let pullSpeed = (7 + (gameTime * 0.05)) * 0.7; 
            g.x += (dx / (dist || 1)) * pullSpeed;
            g.y += (dy / (dist || 1)) * pullSpeed;

            if (dist < player.radius + 8) {
                player.exp += 1;
                g.isCollected = true;
                checkLevelUp();
            }
        });
        gems = gems.filter(g => !g.isCollected);

        beams.forEach(b => b.life--);
        beams = beams.filter(b => b.life > 0);
    }

    function checkLevelUp() {
        if (player.exp >= player.maxExp) {
            player.exp -= player.maxExp;
            player.level++;
            player.maxExp = Math.floor(player.maxExp * 1.25) + 4;
            
            // 【新機能：レベルアップ時の自動永久成長システム】
            player.maxHp += 5;
            player.hp = Math.min(player.maxHp, player.hp + 5); // 最大値と同時にHPも5回復
            player.atkPowerMultiplier += 0.02; // 攻撃力基礎値 +2%
            player.atkSpdMultiplier += 0.02;   // 攻撃速度基礎値 +2%
            
            isPaused = true;
            
            // 5の倍数のレベルのときは「神器化」、それ以外は「通常ビルド」
            if (player.level % 5 === 0) {
                showShingiSelection();
            } else {
                showNormalBuildSelection();
            }
        }
        updateUI();
    }

    // 通常ビルドの3択提示
    function showNormalBuildSelection() {
        document.getElementById('overlay-main-title').innerText = `LEVEL UP!! (Lv.${player.level})`;
        document.getElementById('overlay-sub-title').innerText = "機体強化バフを選択してください（Lvアップボーナス付与済）";
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";

        // シャッフルして3つ選出
        let choices = [...BUILDS].sort(() => Math.random() - 0.5).slice(0, 3);

        choices.forEach(b => {
            let card = document.createElement('div');
            card.className = "card";
            card.onclick = () => {
                applyNormalBuild(b.type);
                closeOverlay();
            };
            card.innerHTML = `<div class="card-name">${b.name}</div><div class="card-desc">${b.desc}</div>`;
            container.appendChild(card);
        });

        document.getElementById('overlay').classList.remove('hidden');
    }

    function applyNormalBuild(type) {
        if (type === 'speed') player.atkSpdMultiplier += 0.10;
        if (type === 'power') player.atkPowerMultiplier += 0.10;
        if (type === 'count') player.shootCount += 1;
        if (type === 'pierce') player.pierceCount += 1;
        if (type === 'heal') {
            let lostHp = player.maxHp - player.hp;
            let randomHeal = Math.floor(Math.random() * 71) + 30; // 30~100
            let bonusHeal = Math.floor(lostHp * 0.05); // 減少体力の5%
            player.hp = Math.min(player.maxHp, player.hp + randomHeal + bonusHeal);
        }
    }

    // 神器化の2択提示
    function showShingiSelection() {
        document.getElementById('overlay-main-title').innerText = "✨ 神器化覚醒 ✨";
        document.getElementById('overlay-sub-title').innerText = "破格の力を得るが、代償が伴う（2択から選択）";

        const container = document.getElementById('options-container');
        container.innerHTML = "";

        // シャッフルして2つ選出
        let choices = [...SHINGI].sort(() => Math.random() - 0.5).slice(0, 2);

        choices.forEach(s => {
            let card = document.createElement('div');
            card.className = "card shingi";
            card.onclick = () => {
                s.action();
                closeOverlay();
            };
            card.innerHTML = `
                <div class="card-name" style="color:#e9d5ff;">${s.name}</div>
                <div class="card-desc" style="color:#cbd5e1; margin-bottom:4px;">${s.desc}</div>
                <div><span class="card-buff">${s.buff}</span> / <span class="card-nerf">${s.nerf}</span></div>
            `;
            container.appendChild(card);
        });

        document.getElementById('overlay').classList.remove('hidden');
    }

    function closeOverlay() {
        isPaused = false;
        document.getElementById('overlay').classList.add('hidden');
        updateUI();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // デッドライン（防衛線）の赤色表示
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, player.y);
        ctx.lineTo(canvas.width, player.y);
        ctx.stroke();

        // オーブ描画
        gems.forEach(g => {
            ctx.fillStyle = '#00ff66';
            ctx.beginPath();
            ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // 敵描画
        enemies.forEach(e => {
            ctx.fillStyle = e.isBoss ? '#f43f5e' : '#3b82f6';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();

            if (e.hp < e.maxHp) {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(e.x - 12, e.y - e.radius - 6, 24, 3);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(e.x - 12, e.y - e.radius - 6, (e.hp / e.maxHp) * 24, 3);
            }
        });

        // バチバチ電撃ビーム描画
        ctx.strokeStyle = '#a855f7';
        ctx.shadowBlur = 8; ctx.shadowColor = '#c084fc';
        beams.forEach(b => {
            ctx.lineWidth = Math.random() * 2 + 1.5;
            ctx.beginPath();
            ctx.moveTo(b.sx, b.sy);
            let segments = 3;
            for (let i = 1; i < segments; i++) {
                let t = i / segments;
                let cx = b.sx + (b.tx - b.sx) * t + (Math.random() - 0.5) * 16;
                let cy = b.sy + (b.ty - b.sy) * t + (Math.random() - 0.5) * 16;
                ctx.lineTo(cx, cy);
            }
            ctx.lineTo(b.tx, b.ty);
            ctx.stroke();
        });
        ctx.shadowBlur = 0;

        // プレイヤー基地描画
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // プレイヤーのHP表示
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(player.x - 25, player.y + 20, 50, 5);
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(player.x - 25, player.y + 20, (player.hp / player.maxHp) * 50, 5);
    }

    function updateUI() {
        let m = Math.floor(gameTime / 60).toString().padStart(2, '0');
        let s = (gameTime % 60).toString().padStart(2, '0');
        document.getElementById('time-box').innerText = `${m}:${s}`;
        document.getElementById('lv-box').innerText = `Lv.${player.level}`;

        let expPct = (player.exp / player.maxExp) * 100;
        document.getElementById('exp-fill').style.width = `${expPct}%`;
    }

    function endGame(msg) {
        isGameOver = true;
        let m = Math.floor(gameTime / 60); let s = gameTime % 60;
        
        document.getElementById('ui-result-text').innerHTML = `
            ${msg}<br>
            <span style="font-size:20px; color:#fff; font-weight:bold;">生存時間: ${m}分${s}秒</span><br>
            最終到達レベル: Lv.${player.level}<br><br>
            <span style="font-size:12px; color:#aaa;">[最終ビルドスタッツ]<br>
            最大HP上限: ${player.maxHp}<br>
            電撃攻撃速度: ×${player.atkSpdMultiplier.toFixed(2)}<br>
            電撃一撃火力: ×${player.atkPowerMultiplier.toFixed(2)}<br>
            同時攻撃本数: ${player.shootCount}本 / 貫通連鎖数: ${player.pierceCount}体</span>
        `;
        document.getElementById('gameover-overlay').classList.remove('hidden');
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    initGame();
    loop();
</script>

</body>
</html>
