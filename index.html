<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Game OS</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #111; color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px;
            background: #000; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 4px solid #333; border-radius: 20px;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 1; background: #000;
        }
        .hidden { display: none !important; }
        .back-home-btn {
            position: absolute; top: 15px; left: 15px; z-index: 99;
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px;
        }

        /* --- 1. ホーム画面 --- */
        #home-screen {
            background: linear-gradient(135deg, #1f4068, #162447);
            padding: 60px 20px 20px 20px;
        }
        .coin-counter {
            background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px;
            text-align: center; font-size: 18px; color: #ffd700; font-weight: bold; margin-bottom: 25px;
        }
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-img {
            width: 70px; height: 70px; border-radius: 18px; display: flex;
            justify-content: center; align-items: center; font-size: 32px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); transition: transform 0.1s;
        }
        .app-icon:active .app-img { transform: scale(0.9); }
        .app-label { margin-top: 6px; font-size: 11px; text-align: center; text-shadow: 1px 1px 2px #000; }
        #icon-reflex { background: linear-gradient(135deg, #ff0055, #7a00ff); }
        #icon-idle { background: linear-gradient(135deg, #ffcc00, #d4af37); }
        #icon-tetris { background: linear-gradient(135deg, #00ccff, #0044ff); }
        #icon-shooting { background: linear-gradient(135deg, #00ff66, #009944); }
        #icon-gacha { background: linear-gradient(135deg, #e94560, #ff00a0); }

        /* --- 2. 反射神経ゲーム --- */
        #reflex-screen { background: #0f0f16; }
        #reflex-arena { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 20px; }
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; }
        .warn-parry { border: 8px solid #ffcc00; box-shadow: inset 0 0 50px rgba(255,204,0,0.6); }
        .warn-dodge { border: 8px solid #ff3333; box-shadow: inset 0 0 50px rgba(255,51,51,0.6); }
        .reflex-ui-panel { display: flex; width: 100%; height: 90px; background: #1a1a24; }
        .reflex-btn { flex: 1; border: none; font-size: 20px; font-weight: bold; color: #fff; cursor: pointer; }
        #r-parry { background: #ffaa00; } #r-dodge { background: #3399ff; }

        /* --- 3. 放置ゲーム --- */
        #idle-screen { background: #1a1a2e; padding: 60px 15px 20px 15px; }
        .idle-stats { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .idle-enemy { background: #162447; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .hp-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .hp-fill { height: 100%; background: #e94560; width: 100%; }
        .shop-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .shop-item { background: #0f172a; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .shop-btn { background: #00b757; border: none; color: #fff; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .shop-btn:disabled { background: #444; }

        /* --- 4. テトリス --- */
        #tetris-screen { background: #111; padding-top: 50px; align-items: center; }
        #tetris-canvas { background: #000; border: 2px solid #333; }
        .tetris-controls { width: 100%; max-width: 320px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px; }
        .t-btn { background: #222; border: none; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .t-btn:active { background: #444; }

        /* --- 5. シューティング --- */
        #shooting-screen { background: #05050a; padding-top: 50px; align-items: center; }
        #shooting-canvas { background: #000; border: 2px solid #224422; }
        .stg-controls { width: 100%; display: flex; height: 80px; background: #111; }
        .stg-btn { flex: 1; border: none; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; }
        #stg-left { background: #222; } #stg-right { background: #333; }

        /* --- 6. ガチャ＆永久バフ --- */
        #gacha-screen { background: #1a0826; padding: 60px 15px 20px 15px; }
        .buff-container { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; }
        .buff-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #00ffcc; }
        .gacha-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #2b1042; border-radius: 15px; border: 2px dashed #ff00a0; }
        #gacha-animation { font-size: 60px; margin: 20px; height: 80px; }

        /* ダメージポップアップ・汎用オーバーレイ */
        .dmg-popup { position: absolute; font-size: 28px; color: #ffcc00; font-weight: bold; animation: popupAnim 0.5s forwards; pointer-events: none; z-index: 10; }
        @keyframes popupAnim { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
        .game-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; z-index: 20; }
        .modal-btn { background: #e94560; border: none; color:#fff; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div id="phone-shell">

    <!-- ================= 1. ホーム画面 ================= -->
    <div id="home-screen" class="screen">
        <div class="coin-counter">ガチャコイン: <span id="home-coin-count">0</span> 枚</div>
        <div class="app-grid">
            <div class="app-icon" onclick="switchScreen('reflex-screen')">
                <div class="app-img" id="icon-reflex">👺</div>
                <div class="app-label">秒殺コロシアム</div>
            </div>
            <div class="app-icon" onclick="switchScreen('idle-screen')">
                <div class="app-img" id="icon-idle">💰</div>
                <div class="app-label">無限採掘RPG</div>
            </div>
            <div class="app-icon" onclick="switchScreen('tetris-screen')">
                <div class="app-img" id="icon-tetris">🧱</div>
                <div class="app-label">テトリス</div>
            </div>
            <div class="app-icon" onclick="switchScreen('shooting-screen')">
                <div class="app-img" id="icon-shooting">🚀</div>
                <div class="app-label">銀河防衛戦</div>
            </div>
            <div class="app-icon" onclick="switchScreen('gacha-screen')">
                <div class="app-img" id="icon-gacha">🎁</div>
                <div class="app-label">バフガチャ</div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 反射神経ゲーム ================= -->
    <div id="reflex-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="reflex-arena">
            <div id="r-streak" style="text-align: center; font-size: 28px; color: #ffcc00; font-weight: bold;">0 KILL</div>
            <div id="flash-overlay"></div>
            <div style="text-align:center;">
                <div id="r-boss-name" style="color:#ff3333; margin-bottom:5px; font-size:14px;">第1層</div>
                <div id="r-boss-visual" style="font-size:60px; transition: transform 0.05s;">👺</div>
            </div>
            <div style="text-align:center; font-size:40px;">⚔️</div>
        </div>
        <div class="reflex-ui-panel">
            <button id="r-parry" class="reflex-btn" onclick="playerReflexAction('PARRY')">弾く</button>
            <button id="r-dodge" class="reflex-btn" onclick="playerReflexAction('DODGE')">避ける</button>
        </div>
        <div id="r-result-modal" class="game-overlay hidden">
            <h2 style="color:#ff3333; font-size:32px; margin-bottom:10px;">消 滅</h2>
            <p id="r-death-reason" style="color:#ccc; font-size:13px; line-height:1.5; margin-bottom:10px;"></p>
            <p id="r-coin-alert" style="color:#ffd700; font-weight:bold;"></p>
            <button class="modal-btn" onclick="initReflexGame()">再挑戦</button>
        </div>
    </div>

    <!-- ================= 3. 放置ゲーム ================= -->
    <div id="idle-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div class="idle-stats">
            <div style="font-size:12px; color:#aaa;">鉱石換金資産</div>
            <div id="idle-gold" style="font-size:24px; color:#ffd700; font-weight:bold;">$ 0</div>
            <div id="idle-gps" style="font-size:11px; color:#00cc77;">自動: +$0/秒</div>
        </div>
        <div class="idle-enemy">
            <div id="idle-enemy-name" style="font-weight:bold; font-size:14px;">ブロンズ鉱石</div>
            <div id="idle-enemy-visual" style="font-size:50px; margin:10px 0; cursor:pointer;">🪨</div>
            <div class="hp-bar"><div id="idle-hp-fill" class="hp-fill"></div></div>
        </div>
        <div class="shop-list">
            <div class="shop-item">
                <div><div style="font-size:13px;">つるはし強化 (Lv.<span id="lvl-atk">1</span>)</div><div style="font-size:11px; color:#aaa;">威力: <span id="val-atk">1</span></div></div>
                <button id="btn-up-atk" class="shop-btn" onclick="buyIdleUpgrade('atk')">$ 10</button>
            </div>
            <div class="shop-item">
                <div><div style="font-size:13px;">自動採掘ドリル (Lv.<span id="lvl-auto">0</span>)</div><div style="font-size:11px; color:#aaa;">毎秒: <span id="val-auto">0</span></div></div>
                <button id="btn-up-auto" class="shop-btn" onclick="buyIdleUpgrade('auto')">$ 50</button>
            </div>
        </div>
    </div>

    <!-- ================= 4. テトリス ================= -->
    <div id="tetris-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="tetris-score" style="font-size: 18px; color: #00ccff; margin: 55px 0 5px 0; text-align:center;">SCORE: 0</div>
        <canvas id="tetris-canvas" width="200" height="400"></canvas>
        <div class="tetris-controls">
            <button class="t-btn" onclick="moveTetro(-1)">←</button>
            <button class="t-btn" onclick="rotateTetro(-1)">左回転</button>
            <button class="t-btn" onclick="rotateTetro(1)">右回転</button>
            <button class="t-btn" onclick="moveTetro(1)">→</button>
            <button class="t-btn" onclick="dropTetro()" style="grid-column: span 4; background:#0044ff;">一気に落とす</button>
        </div>
    </div>

    <!-- ================= 5. シューティング ================= -->
    <div id="shooting-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="stg-score" style="font-size:18px; color:#00ff66; margin:55px 0 5px 0; text-align:center;">SCORE: 0</div>
        <canvas id="shooting-canvas" width="300" height="400"></canvas>
        <div class="stg-controls">
            <button id="stg-left" class="stg-btn" onpointerdown="stgMoveLeft=true" onpointerup="stgMoveLeft=false" onpointerleave="stgMoveLeft=false">← 左移動</button>
            <button id="stg-right" class="stg-btn" onpointerdown="stgMoveRight=true" onpointerup="stgMoveRight=false" onpointerleave="stgMoveRight=false">右移動 →</button>
        </div>
        <div id="stg-result-modal" class="game-overlay hidden">
            <h2 style="color:#ff3333; font-size:32px; margin-bottom:10px;">撃 破</h2>
            <p id="stg-result-score" style="color:#fff; margin-bottom:10px;"></p>
            <p id="stg-coin-alert" style="color:#ffd700; font-weight:bold;"></p>
            <button class="modal-btn" onclick="initShootingGame()">リトライ</button>
        </div>
    </div>

    <!-- ================= 6. ガチャ＆永久バフ ================= -->
    <div id="gacha-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div style="margin-top:55px; text-align:center; font-size:18px; font-weight:bold; color:#ff00a0;">永久アンロックバフ</div>
        <div class="buff-container">
            <div class="buff-row"><span>テトリス スコア倍率:</span><span id="buff-tetris-val">1.0x</span></div>
            <div class="buff-row"><span>反射神経 敵待機延長:</span><span id="buff-reflex-val">+0.0s</span></div>
            <div class="buff-row"><span>放置ゲーム オフライン化:</span><span id="buff-idle-val">未開放 (0%)</span></div>
        </div>
        <div style="text-align:center; margin-bottom:10px; font-weight:bold; color:#ffd700;">
            手持ちコイン: <span id="gacha-coin-count">0</span> 枚
        </div>
        <div class="gacha-box">
            <div id="gacha-animation">🎁</div>
            <button id="gacha-pull-btn" class="modal-btn" onclick="pullGacha()" style="background:linear-gradient(45deg, #e94560, #ff00a0); font-weight:bold; margin-top:0;">ガチャを引く (消費: 1枚)</button>
            <div id="gacha-result-text" style="margin-top:15px; font-weight:bold; color:#00ffcc; min-height:20px;"></div>
        </div>
    </div>

</div>

<script>
    // --- グローバル状態・コイン・バフ管理 ---
    let globalCoins = 0;
    let buffTetrisMultiplier = 1.0; // テトリススコア倍率
    let buffReflexDelay = 0;        // 反射神経敵待機追加秒
    let buffIdleOfflineLevel = 0;   // 放置ゲーム自動化割合(1Lvごとに10%自動攻撃)

    function updateCoinDisplays() {
        document.getElementById('home-coin-count').innerText = globalCoins;
        document.getElementById('gacha-coin-count').innerText = globalCoins;
    }

    function addCoins(amount) {
        globalCoins += amount;
        updateCoinDisplays();
    }

    function switchScreen(screenId) {
        // すべてのループを一度クリア
        clearTimeout(reflexTimer);
        clearInterval(idleInterval);
        clearInterval(tetrisInterval);
        cancelAnimationFrame(stgAnimationId);

        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');

        // 各アプリ固有の起動処理
        if (screenId === 'reflex-screen') initReflexGame();
        if (screenId === 'idle-screen') startIdleGame();
        if (screenId === 'tetris-screen') initTetrisGame();
        if (screenId === 'shooting-screen') initShootingGame();
        if (screenId === 'gacha-screen') updateGachaUI();
    }

    function exitToHome() {
        clearTimeout(reflexTimer);
        clearInterval(idleInterval);
        clearInterval(tetrisInterval);
        cancelAnimationFrame(stgAnimationId);
        
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('home-screen').classList.remove('hidden');
        updateCoinDisplays();
    }

    // ================= 2. 反射神経ゲーム ロジック =================
    let reflexStreak = 0;
    let reflexActive = false;
    let reflexTimer = null;
    let reflexAttackType = '';
    let reflexWindowStart = 0;
    let reflexWindowDuration = 600;
    let reflexElapsedTime = 0;

    function initReflexGame() {
        reflexStreak = 0;
        document.getElementById('r-streak').innerText = "0 KILL";
        document.getElementById('r-result-modal').classList.add('hidden');
        spawnReflexBoss();
    }

    function spawnReflexBoss() {
        reflexActive = true;
        document.getElementById('r-boss-name').innerText = `第 ${reflexStreak + 1} 層`;
        document.getElementById('r-boss-visual').style.transform = "scale(1)";
        document.getElementById('flash-overlay').style.opacity = '0';
        reflexWindowStart = 0;
        reflexElapsedTime = 0;

        const baseDelays = [2000, 3000, 5000];
        let initialWait = baseDelays[Math.floor(Math.random() * baseDelays.length)];
        
        // 【永久バフ効果適用】敵の初期待機時間を延長
        initialWait += (buffReflexDelay * 1000);
        reflexElapsedTime += initialWait;

        reflexTimer = setTimeout(evaluateReflexWaitLoop, initialWait);
    }

    function evaluateReflexWaitLoop() {
        if (!reflexActive) return;

        let p3 = 10, p2 = 25, p5 = 33, p7 = 15;
        let currentSeconds = reflexElapsedTime / 1000;

        if (currentSeconds > 9) {
            let deduction = 30 + (Math.floor(currentSeconds - 9) * 10);
            p3 = Math.max(0, p3 - deduction); p2 = Math.max(0, p2 - deduction); p5 = Math.max(0, p5 - deduction); p7 = Math.max(0, p7 - deduction);
        } else if (currentSeconds > 6) {
            p3 = Math.max(0, p3 - 10); p2 = Math.max(0, p2 - 10); p5 = Math.max(0, p5 - 10); p7 = Math.max(0, p7 - 10);
        }

        let roll = Math.random() * 100;
        let nextWait = 0;

        if (roll < p3) nextWait = 300;
        else if (roll < p3 + p2) nextWait = 200;
        else if (roll < p3 + p2 + p5) nextWait = 500;
        else if (roll < p3 + p2 + p5 + p7) nextWait = 700;

        if (nextWait === 0) {
            triggerReflexAttack();
        } else {
            reflexElapsedTime += nextWait;
            reflexTimer = setTimeout(evaluateReflexWaitLoop, nextWait);
        }
    }

    function triggerReflexAttack() {
        reflexAttackType = Math.random() > 0.5 ? 'PARRY' : 'DODGE';
        reflexWindowDuration = Math.max(150, 550 - (reflexStreak * 25));

        const flash = document.getElementById('flash-overlay');
        flash.className = '';
        flash.classList.add(reflexAttackType === 'PARRY' ? 'warn-parry' : 'warn-dodge');
        flash.style.opacity = '1';
        document.getElementById('r-boss-visual').style.transform = "scale(1.2) translateY(5px)";

        reflexWindowStart = performance.now();

        reflexTimer = setTimeout(() => {
            reflexDie(`敵の神速の攻撃！\n(フェイント蓄積時間: ${(reflexElapsedTime/1000).toFixed(2)}秒に翻弄された)`);
        }, reflexWindowDuration);
    }

    function playerReflexAction(type) {
        if (!reflexActive) return;

        if (reflexWindowStart === 0) {
            reflexDie("フライング自滅！\n敵が動く前のフェイントの溜め時間に釣られてしまった。");
            return;
        }

        clearTimeout(reflexTimer);
        const reaction = (performance.now() - reflexWindowStart).toFixed(0);

        if (type === reflexAttackType) {
            reflexActive = false;
            reflexStreak++;
            document.getElementById('r-streak').innerText = `${reflexStreak} KILL`;
            
            const p = document.createElement('div');
            p.classList.add('dmg-popup'); p.innerText = "💥CRITICAL";
            p.style.left = "40%"; p.style.top = "45%";
            document.getElementById('reflex-arena').appendChild(p);
            setTimeout(() => p.remove(), 500);

            setTimeout(spawnReflexBoss, 800);
        } else {
            reflexDie(`防御ミス！\n指示と違う行動をとってしまった。\n(反応時間: ${reaction}ms)`);
        }
    }

    function reflexDie(reason) {
        reflexActive = false;
        clearTimeout(reflexTimer);
        
        // コイン計算：参加賞1枚 + 3キルごとに1枚追加
        let earned = 1 + Math.floor(reflexStreak / 3);
        addCoins(earned);

        document.getElementById('r-death-reason').innerText = reason;
        document.getElementById('r-coin-alert').innerText = `🎁 ガチャコインを ${earned} 枚獲得！`;
        document.getElementById('r-result-modal').classList.remove('hidden');
    }

    // ================= 3. 放置ゲーム ロジック =================
    let idleGold = 0;
    let idleAtkLvl = 1;
    let idleAutoLvl = 0;
    let enemyMaxHp = 10;
    let enemyHp = 10;
    let idleInterval = null;

    const idleEnemyData = [
        { name: "ブロンズ鉱石", emoji: "🪨" },
        { name: "シルバー原石", emoji: "🪙" },
        { name: "ゴールド金塊", emoji: "👑" },
        { name: "クリスタル大結晶", emoji: "💎" }
    ];
    let idleEnemyIdx = 0;

    function startIdleGame() {
        clearInterval(idleInterval);
        updateIdleUI();

        // 1秒ごとのループ
        idleInterval = setInterval(() => {
            let autoDmg = idleAutoLvl * 2;
            
            // 【永久バフ効果適用】他のアプリ起動中（オフライン）でも、自動ドリルが強化割合に応じてダメージ代行
            if (buffIdleOfflineLevel > 0) {
                autoDmg += (idleAutoLvl * 2 * (buffIdleOfflineLevel * 0.1));
            }

            if (autoDmg > 0) damageIdleEnemy(autoDmg);
            updateIdleUI();
        }, 1000);

        document.getElementById('idle-enemy-visual').onclick = () => {
            damageIdleEnemy(idleAtkLvl);
            updateIdleUI();
        };
    }

    function damageIdleEnemy(amount) {
        enemyHp -= amount;
        if (enemyHp <= 0) {
            let payout = Math.floor(enemyMaxHp * 0.4) + 2;
            idleGold += payout;

            // 確率でガチャコイン獲得（採掘時に稀に手に入るボーナス）
            if (Math.random() < 0.15) {
                addCoins(1);
                // 簡易ポップアップ表示
                const p = document.createElement('div');
                p.classList.add('dmg-popup'); p.innerText = "🪙Coin+1";
                p.style.left = "45%"; p.style.top = "30%";
                document.getElementById('idle-screen').appendChild(p);
                setTimeout(() => p.remove(), 600);
            }

            // 敵のスケールアップ
            idleEnemyIdx = (idleEnemyIdx + 1) % idleEnemyData.length;
            enemyMaxHp = Math.floor(enemyMaxHp * 1.35) + 4;
            enemyHp = enemyMaxHp;

            document.getElementById('idle-enemy-name').innerText = idleEnemyData[idleEnemyIdx].name;
            document.getElementById('idle-enemy-visual').innerText = idleEnemyData[idleEnemyIdx].emoji;
        }
    }

    function buyIdleUpgrade(type) {
        if (type === 'atk') {
            let cost = idleAtkLvl * 10;
            if (idleGold >= cost) { { idleGold -= cost; idleAtkLvl++; } }
        } else {
            let cost = (idleAutoLvl + 1) * 45;
            if (idleGold >= cost) { { idleGold -= cost; idleAutoLvl++; } }
        }
        updateIdleUI();
    }
