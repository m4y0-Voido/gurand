<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>オート電撃サバイバー (Lightning Survivor)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #05070a; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px; background: #0b0f19;
            border: 4px solid #1f293d; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,255,255,0.1);
        }
        /* UIヘッダー */
        #hud {
            padding: 12px 15px; background: #060911; border-bottom: 2px solid #1f293d;
            display: flex; justify-content: space-between; align-items: center; font-family: monospace;
        }
        #time-box { font-size: 18px; color: #00ffff; font-weight: bold; }
        #lv-box { font-size: 14px; color: #ffcc00; }

        /* 経験値バー */
        #exp-container { width: 100%; height: 6px; background: #1a2233; position: relative; }
        #exp-fill { height: 100%; background: #00ff66; width: 0%; transition: width 0.1s; }

        /* ゲーム画面 */
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #0f172a 0%, #05070a 100%); }
        canvas { display: block; width: 100%; height: 100%; }

        /* ビルド選択画面（レベルアップ時） */
        #build-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.9); z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; gap: 15px;
        }
        .build-title { font-size: 24px; color: #ffcc00; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        .build-card {
            width: 100%; background: #111827; border: 2px solid #374151; padding: 15px; border-radius: 12px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.1s, border-color 0.2s;
        }
        .build-card:hover { border-color: #00ffff; }
        .build-card:active { transform: scale(0.97); }
        .build-info { display: flex; flex-direction: column; gap: 4px; }
        .build-name { font-size: 16px; font-weight: bold; color: #fff; }
        .build-desc { font-size: 12px; color: #9ca3af; }
        .build-level { font-size: 12px; background: #1f293d; padding: 2px 8px; border-radius: 4px; color: #00ffff; font-weight: bold; }

        /* ゲームオーバー画面 */
        #gameover-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 5, 0.95); z-index: 30;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px;
        }
        .go-title { font-size: 36px; color: #ef4444; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
        .btn-restart { background: #ef4444; border: none; color: #fff; padding: 12px 35px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="phone-shell">
    <!-- 上部メーター -->
    <div id="hud">
        <div id="time-box">00:00</div>
        <div id="lv-box">Lv.1</div>
    </div>
    <div id="exp-container"><div id="exp-fill"></div></div>

    <!-- メイン戦闘画面 -->
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>

        <!-- レベルアップ時のビルド選択画面 -->
        <div id="build-overlay" class="hidden">
            <div class="build-title">LEVEL UP!!</div>
            <div style="font-size:12px; color:#9ca3af; margin-bottom:10px;">強化するビルドを1つ選択せよ</div>
            <div id="build-options" style="width:100%; display:flex; flex-direction:column; gap:10px;">
                <!-- JavaScriptで選択肢を自動生成 -->
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-overlay" class="hidden">
            <div class="go-title">大破・戦闘不能</div>
            <p id="ui-result-time" style="color:#9ca3af; font-size:14px;"></p>
            <button class="btn-restart" onclick="initGame()">リベンジする</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ゲーム状態
    let isPaused = false;
    let isGameOver = false;
    let gameTime = 0; // 秒数
    let frameCount = 0;

    // プレイヤーの基礎ステータス
    let player = {
        x: 0, y: 0, radius: 16,
        hp: 100, maxHp: 100,
        level: 1, exp: 0, maxExp: 10,
        // ビルドの現在のレベル
        builds: {
            count: 1,  // 攻撃本数 (初期1)
            speed: 1,  // 攻撃速度
            power: 1,  // 攻撃力
            armor: 0,  // 防御力
            magnet: 1  // 磁石範囲
        }
    };

    // ビルド（スキル）の性能マスターデータ
    const BUILD_MASTER = {
        count: { name: "マルチサンダー", desc: "一度に攻撃できる本数がアップ", max: 5 },
        speed: { name: "ハイチャージ", desc: "電撃の連射速度がアップ", max: 5 },
        power: { name: "ハイパワー", desc: "電撃のダメージが大幅アップ", max: 5 },
        armor: { name: "ナノアーマー", desc: "受けるダメージを固定値カット", max: 5 },
        magnet: { name: "プラズマ磁石", desc: "経験値オーブを吸い寄せる範囲アップ", max: 5 }
    };

    let enemies = [];
    let gems = []; // 経験値オーブ
    let beams = []; // 描画用電撃エフェクト
    let lastAttackTime = 0;

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height - 50; // 最下部に配置
    }
    window.addEventListener('resize', resize);
    resize();

    // 初期化
    function initGame() {
        isGameOver = false;
        isPaused = false;
        gameTime = 0;
        frameCount = 0;
        lastAttackTime = 0;
        enemies = []; gems = []; beams = [];

        player.hp = 100; player.maxHp = 100;
        player.level = 1; player.exp = 0; player.maxExp = 12;
        player.builds = { count: 1, speed: 1, power: 1, armor: 0, magnet: 1 };

        document.getElementById('gameover-overlay').classList.add('hidden');
        document.getElementById('build-overlay').classList.add('hidden');
        updateUI();
    }

    // 敵の出現管理
    function spawnEnemies() {
        if (frameCount % 60 === 0) { // 1秒に1回スポーン判定
            let spawnCount = 1 + Math.floor(gameTime / 20); // 時間経過で増加
            for (let i = 0; i < spawnCount; i++) {
                let isBoss = (gameTime > 0 && gameTime % 30 === 0 && i === 0); // 30秒ごとにボス
                enemies.push({
                    x: Math.random() * (canvas.width - 20) + 10,
                    y: -20 - (Math.random() * 50),
                    radius: isBoss ? 20 : 8,
                    hp: isBoss ? 45 + (gameTime * 2) : 3 + Math.floor(gameTime / 15),
                    maxHp: isBoss ? 45 + (gameTime * 2) : 3 + Math.floor(gameTime / 15),
                    speed: isBoss ? 0.6 : 1.2 + (Math.random() * 0.6),
                    isBoss: isBoss
                });
            }
        }
    }

    // オート攻撃（電撃ロックオン）
    function autoAttack() {
        let now = performance.now();
        // 攻撃速度ビルドによるクールダウン計算（Lvが上がるほど早く撃てる）
        let attackCooldown = Math.max(150, 700 - (player.builds.speed * 90));

        if (now - lastAttackTime > attackCooldown) {
            // プレイヤーに近い順に敵をソート
            let targets = [...enemies].map(e => {
                let dx = e.x - player.x; let dy = e.y - player.y;
                return { enemy: e, dist: Math.sqrt(dx*dx + dy*dy) };
            }).sort((a, b) => a.dist - b.dist);

            // 同時発射数（count）の数だけ、近い敵をロックオンして同時攻撃
            let shootNum = Math.min(player.builds.count, targets.length);
            if (shootNum > 0) {
                lastAttackTime = now;
                let damage = player.builds.power * 3; // 攻撃力ビルド

                for (let i = 0; i < shootNum; i++) {
                    let targetEnemy = targets[i].enemy;
                    targetEnemy.hp -= damage;

                    // 電撃ビームエフェクトを登録
                    beams.push({
                        sx: player.x, sy: player.y,
                        tx: targetEnemy.x, ty: targetEnemy.y,
                        life: 8 // 表示フレーム数
                    });

                    // 敵が死んだら
                    if (targetEnemy.hp <= 0) {
                        // 確率で経験値オーブをドロップ
                        gems.push({ x: targetEnemy.x, y: targetEnemy.y, expValue: targetEnemy.isBoss ? 8 : 1 });
                    }
                }
                // 死んだ敵を除外
                enemies = enemies.filter(e => e.hp > 0);
            }
        }
    }

    // メインアップデート
    function update() {
        if (isPaused || isGameOver) return;

        frameCount++;
        if (frameCount % 60 === 0) {
            gameTime++;
            updateUI();
        }

        spawnEnemies();
        autoAttack();

        // 敵の移動とプレイヤーへの衝突
        enemies.forEach(e => {
            e.y += e.speed; // 上から下へ襲ってくる

            // プレイヤー（防衛ライン）との衝突判定
            let dx = e.x - player.x; let dy = e.y - player.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < player.radius + e.radius || e.y > canvas.height) {
                // ダメージ計算（アーマービルドで固定カット）
                let rawDmg = e.isBoss ? 25 : 8;
                let finalDmg = Math.max(1, rawDmg - player.builds.armor * 2);
                player.hp = Math.max(0, player.hp - finalDmg);
                e.hp = 0; // ぶつかった敵は消滅

                if (player.hp <= 0) {
                    endGame();
                }
            }
        });
        enemies = enemies.filter(e => e.hp > 0);

        // 経験値オーブの引き寄せ（磁石ビルド）
        let magnetRange = 40 + (player.builds.magnet * 35); // 磁石ビルドで範囲拡張
        gems.forEach(g => {
            let dx = player.x - g.x; let dy = player.y - g.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < magnetRange) {
                // 範囲内に入ったら吸い寄せられる
                g.x += (dx / dist) * 5;
                g.y += (dy / dist) * 5;
            }

            if (dist < player.radius + 6) {
                // 回収
                player.exp += g.expValue;
                g.isCollected = true;
                checkLevelUp();
            }
        });
        gems = gems.filter(g => !g.isCollected);

        // ビームエフェクトの寿命消化
        beams.forEach(b => b.life--);
        beams = beams.filter(b => b.life > 0);
    }

    // レベルアップ判定とビルド画面展開
    function checkLevelUp() {
        if (player.exp >= player.maxExp) {
            player.exp -= player.maxExp;
            player.level++;
            player.maxExp = Math.floor(player.maxExp * 1.3) + 5;
            
            isPaused = true; // ゲームを一時停止
            showBuildSelection();
        }
        updateUI();
    }

    // ビルド選択肢の生成
    function showBuildSelection() {
        const container = document.getElementById('build-options');
        container.innerHTML = "";

        // まだMAXレベルに達していないビルドのキーを抽出
        let availableKeys = Object.keys(player.builds).filter(key => {
            return player.builds[key] < BUILD_MASTER[key].max;
        });

        // もし全部MAXなら、体力を全回復する特別選択肢を出す
        if (availableKeys.length === 0) {
            let card = document.createElement('div');
            card.className = "build-card";
            card.onclick = () => { player.hp = player.maxHp; isPaused = false; document.getElementById('build-overlay').classList.add('hidden'); };
            card.innerHTML = `<div class="build-info"><span class="build-name">応急修理</span><span class="build-desc">体力を最大まで全回復する</span></div>`;
            container.appendChild(card);
        } else {
            // シャッフルして最大3つの選択肢を提示
            availableKeys.sort(() => Math.random() - 0.5);
            let displayKeys = availableKeys.slice(0, 3);

            displayKeys.forEach(key => {
                let currentLv = player.builds[key];
                let master = BUILD_MASTER[key];

                let card = document.createElement('div');
                card.className = "build-card";
                card.onclick = () => selectBuild(key);
                card.innerHTML = `
                    <div class="build-info">
                        <span class="build-name">${master.name}</span>
                        <span class="build-desc">${master.desc}</span>
                    </div>
                    <span class="build-level">Lv.${currentLv} ➔ ${currentLv + 1}</span>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('build-overlay').classList.remove('hidden');
    }

    // ビルド決定
    function selectBuild(key) {
        player.builds[key]++;
        isPaused = false; // 再開
        document.getElementById('build-overlay').classList.add('hidden');
        updateUI();
    }

    // ゲーム描画
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 磁石の範囲をうっすら円で描画
        let magnetRange = 40 + (player.builds.magnet * 35);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(player.x, player.y, magnetRange, 0, Math.PI * 2);
        ctx.stroke();

        // 経験値オーブの描画
        gems.forEach(g => {
            ctx.fillStyle = g.expValue > 1 ? '#ff00ff' : '#00ff66';
            ctx.shadowBlur = 6; ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;

        // 敵の描画
        enemies.forEach(e => {
            ctx.fillStyle = e.isBoss ? '#ef4444' : '#3b82f6';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();

            // 敵のHPバー
            if (e.hp < e.maxHp) {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(e.x - 12, e.y - e.radius - 6, 24, 3);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(e.x - 12, e.y - e.radius - 6, (e.hp / e.maxHp) * 24, 3);
            }
        });

        // 電撃ビームエフェクトの描画（バチバチ感を出すためジグザグに描画）
        ctx.strokeStyle = '#00ffff';
        ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
        beams.forEach(b => {
            ctx.lineWidth = Math.random() * 3 + 1;
            ctx.beginPath();
            ctx.moveTo(b.sx, b.sy);
            
            // 中間地点にジグザグを作る
            let segments = 3;
            for (let i = 1; i < segments; i++) {
                let t = i / segments;
                let cx = b.sx + (b.tx - b.sx) * t + (Math.random() - 0.5) * 20;
                let cy = b.sy + (b.ty - b.sy) * t + (Math.random() - 0.5) * 20;
                ctx.lineTo(cx, cy);
            }
            ctx.lineTo(b.tx, b.ty);
            ctx.stroke();
        });
        ctx.shadowBlur = 0;

        // プレイヤー（防衛基地）の描画
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // プレイヤーのHPバー
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(player.x - 30, player.y + 24, 60, 6);
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(player.x - 30, player.y + 24, (player.hp / player.maxHp) * 60, 6);
    }

    // UIのテキスト更新
    function updateUI() {
        let m = Math.floor(gameTime / 60).toString().padStart(2, '0');
        let s = (gameTime % 60).toString().padStart(2, '0');
        document.getElementById('time-box').innerText = `${m}:${s}`;
        document.getElementById('lv-box').innerText = `Lv.${player.level}`;

        let expPct = (player.exp / player.maxExp) * 100;
        document.getElementById('exp-fill').style.width = `${expPct}%`;
    }

    function endGame() {
        isGameOver = true;
        let m = Math.floor(gameTime / 60); let s = gameTime % 60;
        document.getElementById('ui-result-time').innerText = `生存時間: ${m}分${s}秒 (到達Lv.${player.level})`;
        document.getElementById('gameover-overlay').classList.remove('hidden');
    }

    // メインループ
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // 初回起動
    initGame();
    loop();
</script>

</body>
</html>
