<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ギリギリ採掘職人 (Gold Rush Dig)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1105;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 800px;
            background: #2c1d0b; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }
        /* 上部ステータス */
        #header {
            padding: 15px; background: #110b04;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #ffd700;
        }
        #score-box { font-size: 24px; font-weight: bold; color: #ffd700; font-family: monospace; }
        #risk-box { font-size: 14px; color: #ff4444; }

        /* 採掘エリア（グリッド） */
        #grid-container {
            flex: 1; display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px; padding: 15px;
            background: #221608;
        }
        .tile {
            background: #5c3a21; border-radius: 8px;
            border-bottom: 5px solid #3d2616;
            cursor: pointer; display: flex; justify-content: center;
            align-items: center; font-size: 28px;
            transition: all 0.1s;
        }
        .tile:active { transform: scale(0.95); }
        .tile.dug { background: #1a1105; border: 1px solid #333; border-bottom: 1px solid #333; cursor: default; }

        /* 下部操作 */
        #control-panel {
            padding: 15px; background: #110b04; text-align: center;
            border-top: 1px solid #333;
        }
        .btn {
            width: 100%; padding: 15px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 30px; cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        #bank-btn {
            background: linear-gradient(180deg, #ffd700, #ffaa00); color: #000;
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
        }

        /* リザルト画面 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 11, 4, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; text-align: center; z-index: 10;
        }
        h1 { color: #ffd700; font-size: 28px; margin-bottom: 10px; }
        .result-card {
            background: #221608; border: 2px solid #ffd700;
            padding: 20px; border-radius: 15px; width: 100%; margin-bottom: 20px;
        }
        .rank-text { font-size: 24px; font-weight: bold; color: #ff4444; margin: 10px 0; }
        .btn-restart { background: #fff; color: #000; margin-bottom: 10px; }
        .btn-share { background: #1d9bf0; color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ヘッダー -->
    <div id="header">
        <div>
            <div style="font-size:12px; color:#aaa;">現在のキープ額</div>
            <div id="score-box">$ 0</div>
        </div>
        <div id="risk-box">爆弾の確率: 0%</div>
    </div>

    <!-- グリッド -->
    <div id="grid-container"></div>

    <!-- コントロール -->
    <div id="control-panel">
        <button id="bank-btn" class="btn">利益を確定して帰還する</button>
    </div>

    <!-- ゲームオーバー/クリア画面共通 -->
    <div id="result-overlay" class="overlay hidden">
        <h1 id="result-title">爆死！強制終了</h1>
        <div class="result-card">
            <p id="result-status">獲得賞金: $0</p>
            <div id="result-analysis" class="rank-text">強欲度: 100%</div>
            <p id="result-comment" style="font-size:14px; color:#bbb;"></p>
        </div>
        <button id="restart-btn" class="btn btn-restart">次の山へ突撃</button>
        <button id="share-btn" class="btn btn-share">結果をXに晒す</button>
    </div>
</div>

<script>
    const gridContainer = document.getElementById('grid-container');
    const scoreBox = document.getElementById('score-box');
    const riskBox = document.getElementById('risk-box');
    const bankBtn = document.getElementById('bank-btn');
    const resultOverlay = document.getElementById('result-overlay');
    const resultTitle = document.getElementById('result-title');
    const resultStatus = document.getElementById('result-status');
    const resultAnalysis = document.getElementById('result-analysis');
    const resultComment = document.getElementById('result-comment');
    const restartBtn = document.getElementById('restart-btn');
    const shareBtn = document.getElementById('share-btn');

    let currentGold = 0;
    let dugCount = 0;
    let bombIndex = -1;
    let isGameOver = false;
    let history = []; // プレイヤーの行動ログ

    // ステージ初期化
    function initStage() {
        gridContainer.innerHTML = '';
        currentGold = 0;
        dugCount = 0;
        isGameOver = false;
        history = [];
        scoreBox.innerText = `$ ${currentGold}`;
        
        // 16マスのうち1つに爆弾を配置
        bombIndex = Math.floor(Math.random() * 16);
        updateRisk();

        for (let i = 0; i < 16; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.innerText = '🪓';
            tile.dataset.index = i;
            tile.addEventListener('click', () => digTile(tile, i));
            gridContainer.appendChild(tile);
        }
    }

    // 確率表示の更新
    function updateRisk() {
        const remainingTiles = 16 - dugCount;
        const probability = Math.round((1 / remainingTiles) * 100);
        riskBox.innerText = `次の一掘りで爆死する確率: ${probability}%`;
    }

    // タイルを掘る
    function digTile(tile, index) {
        if (isGameOver || tile.classList.contains('dug')) return;

        tile.classList.add('dug');
        dugCount++;

        if (index === bombIndex) {
            // 爆弾を踏んだ
            tile.innerText = '💥';
            gameOver(false);
        } else {
            // 金塊ゲット（掘れば掘るほど1回の価値が跳ね上がる）
            const earned = dugCount * 100;
            currentGold += earned;
            tile.innerText = '💰';
            scoreBox.innerText = `$ ${currentGold}`;
            
            history.push(earned);
            updateRisk();

            // 全て掘り尽くしたら強制クリア
            if (dugCount === 15) {
                gameOver(true);
            }
        }
    }

    // 終了処理
    function gameOver(isSuccess) {
        isGameOver = true;
        resultOverlay.classList.remove('hidden');

        let greedRate = Math.round((dugCount / 15) * 100);
        
        if (isSuccess) {
            resultTitle.innerText = "🎉 伝説の完全発掘！";
            resultTitle.style.color = "#ffd700";
            resultStatus.innerText = `無傷で全金塊を回収！: $${currentGold}`;
            resultAnalysis.innerText = `強欲度: 100% (神の幸運)`;
            resultComment.innerText = "爆弾を奇跡的にすり抜けました。今すぐ宝くじを買いに行ってください。";
        } else if (history.length === 0) {
            // 1ポチ目で死亡
            resultTitle.innerText = "😭 悲惨な初手爆死";
            resultTitle.style.color = "#ff4444";
            resultStatus.innerText = `獲得賞金: $0`;
            resultAnalysis.innerText = `不運度: 999%`;
            resultComment.innerText = "最初の１掘りで爆弾を引きました。逆にSNSでウケるレベルの才能です。";
        } else {
            // 途中リタイアまたは途中で爆発
            const isBanked = !gridContainer.querySelector('.tile.dug[data-index="'+bombIndex+'"]')?.innerText.includes('💥');
            
            if (isBanked) {
                resultTitle.innerText = "💰 安全に帰還成功！";
                resultTitle.style.color = "#00ffcc";
                resultStatus.innerText = `手堅く利確: $${currentGold}`;
                
                if (greedRate < 20) {
                    resultAnalysis.innerText = `強欲度: ${greedRate}% (超チキン級)`;
                    resultComment.innerText = "石橋を叩き壊すタイプ。もっと自分を追い込んでも良いのでは？";
                } else if (greedRate < 60) {
                    resultAnalysis.innerText = `強欲度: ${greedRate}% (堅実なビジネスマン)`;
                    resultComment.innerText = "一番賢い引き際を知る人間。一番バズりにくい、普通の良い人です。";
                } else {
                    resultAnalysis.innerText = `強欲度: ${greedRate}% (一流のギャンブラー)`;
                    resultComment.innerText = "ヒリつくスリルを楽しみつつ、絶妙なタイミングで逃げ切りました。見事。";
                }
            } else {
                resultTitle.innerText = "💥 欲望に負けて爆死！";
                resultTitle.style.color = "#ff4444";
                resultStatus.innerText = `失った金額: $${currentGold + (dugCount*100)}`;
                resultAnalysis.innerText = `強欲度: ${greedRate}% (ただの欲張り)`;
                resultComment.innerText = `あの時やめておけば大金持ちだったのに、あと一歩の欲望に負けましたね。`;
            }
        }
    }

    // 銀行ボタン（利確）
    bankBtn.addEventListener('click', () => {
        if (dugCount === 0 || isGameOver) return;
        gameOver(false); // 爆弾を踏んでない状態でゲーム終了
    });

    // リスタート
    restartBtn.addEventListener('click', () => {
        resultOverlay.classList.add('hidden');
        initStage();
    });

    // SNSシェア
    shareBtn.addEventListener('click', () => {
        const titleText = resultTitle.innerText;
        const analysisText = resultAnalysis.innerText;
        const text = `【ギリギリ採掘職人】をプレイした！\n結果：${titleText}\nスコア：${scoreBox.innerText}\n${analysisText}\n#ギリギリ採掘職人 #バズりゲーム`;
        window.open(`https://twitter.com{encodeURIComponent(text)}`, '_blank');
    });

    // 初回起動
    initStage();
</script>

</body>
</html>
