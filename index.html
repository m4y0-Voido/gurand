<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ギリギリ・プラネット (GiriGiri Planet)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(circle, #1a233a 0%, #0b0e14 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* UIレイヤー */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            font-family: monospace;
        }
        #start-screen, #gameover-screen {
            background: rgba(11, 14, 20, 0.85);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            width: 85%;
        }
        h1 {
            font-size: 28px;
            margin-top: 0;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }
        .btn {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,255,255,0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #share-btn {
            background: #1d9bf0;
            box-shadow: 0 5px 15px rgba(29,155,240,0.4);
            margin-top: 10px;
        }
        #result-rank {
            font-size: 24px;
            color: #ff3366;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(255,51,102,0.5);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id-container="game-container" id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- プレイ中のスコア表示 -->
    <div id="hud">0.00s</div>
    
    <!-- スタート画面 -->
    <div class="ui-layer">
        <div id="start-screen" class="interactive">
            <h1>ギリギリ・プラネット</h1>
            <p>画面クリックで「重力反転」！<br>内側と外側の軌道を切り替えて、迫り来るデブリ（赤玉）をギリギリで避け続けろ！</p>
            <button class="btn" id="start-btn">ミッション開始</button>
        </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div class="ui-layer">
        <div id="gameover-screen" class="interactive hidden">
            <h1>大破・ミッション失敗</h1>
            <p>あなたの生存時間: <span id="result-score" style="font-size:22px; font-weight:bold; color:#fff;">0.00</span> 秒</p>
            <div id="result-rank">評価: 宇宙の塵</div>
            <button class="btn" id="restart-btn">もう一度挑戦</button>
            <button class="btn" id="share-btn">結果をXでポスト</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const shareBtn = document.getElementById('share-btn');
    const resultScore = document.getElementById('result-score');
    const resultRank = document.getElementById('result-rank');

    // 画面サイズ合わせ
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ゲーム状態
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lastTime = 0;

    // ゲームバランス調整用変数
    const CENTER = { x: 0, y: 0 };
    const ORBIT_INNER = 60;
    const ORBIT_OUTER = 110;
    
    let player = {
        angle: 0,
        speed: 0.04,
        targetRadius: ORBIT_INNER,
        currentRadius: ORBIT_INNER,
        size: 8
    };

    let obstacles = [];
    let obstacleSpawnTimer = 0;
    let obstacleSpeedMultiplier = 1;

    // ランク判定関数
    function getRank(score) {
        if (score < 5) return '評価: 宇宙のゴミ';
        if (score < 15) return '評価: 一般宇宙飛行士';
        if (score < 30) return '評価: エリートパイロット';
        if (score < 50) return '評価: ニュータイプ';
        return '評価: 銀河の救世主';
    }

    // 初期化
    function initGame() {
        score = 0;
        obstacles = [];
        obstacleSpawnTimer = 0;
        obstacleSpeedMultiplier = 1;
        player.angle = 0;
        player.targetRadius = ORBIT_INNER;
        player.currentRadius = ORBIT_INNER;
        player.speed = 0.04;
        lastTime = performance.now();
    }

    // スタートボタン
    startBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        gameState = 'PLAYING';
        initGame();
    });

    // リスタートボタン
    restartBtn.addEventListener('click', () => {
        gameoverScreen.classList.add('hidden');
        gameState = 'PLAYING';
        initGame();
    });

    // シェアボタン (X / Twitterへの投稿)
    shareBtn.addEventListener('click', () => {
        const text = `【ギリギリ・プラネット】で生存時間 ${score.toFixed(2)}秒を記録！\n${getRank(score)}\n#ギリギリプラネット #バズりゲーム`;
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com{encodeURIComponent(text)}`, '_blank');
    });

    // 画面クリックで重力反転（軌道変更）
    window.addEventListener('pointerdown', (e) => {
        if (gameState !== 'PLAYING') return;
        // UIボタンをクリックした場合は反応させない
        if (e.target.tagName === 'BUTTON') return;

        if (player.targetRadius === ORBIT_INNER) {
            player.targetRadius = ORBIT_OUTER;
        } else {
            player.targetRadius = ORBIT_INNER;
        }
    });

    // 障害物（デブリ）のスポーン
    function spawnObstacle() {
        const isOuter = Math.random() > 0.5;
        const radius = isOuter ? ORBIT_OUTER : ORBIT_INNER;
        // プレイヤーの進行方向の少し先、またはランダムな角度から出現
        const angle = player.angle + Math.PI + (Math.random() - 0.5) * 2; 
        
        obstacles.push({
            angle: angle,
            radius: radius,
            size: 10,
            speed: (0.015 + Math.random() * 0.015) * obstacleSpeedMultiplier * (Math.random() > 0.5 ? 1 : -1)
        });
    }

    // メインループ
    function loop(timestamp) {
        CENTER.x = canvas.width / 2;
        CENTER.y = canvas.height / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景のグリッドや装飾
        drawBackground();

        if (gameState === 'PLAYING') {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // カクつき対策
            lastTime = timestamp;

            score += dt;
            hud.innerText = score.toFixed(2) + 's';

            // 難易度上昇
            obstacleSpeedMultiplier = 1 + score * 0.02;
            player.speed = 0.04 + score * 0.0005;

            // プレイヤーの半径移動（なめらかに）
            player.currentRadius += (player.targetRadius - player.currentRadius) * 0.2;
            player.angle += player.speed;

            // 障害物生成管理
            obstacleSpawnTimer += dt;
            const spawnInterval = Math.max(0.4, 1.2 - score * 0.02);
            if (obstacleSpawnTimer >= spawnInterval) {
                spawnObstacle();
                obstacleSpawnTimer = 0;
            }

            // 障害物の更新と衝突判定
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.angle += obs.speed;

                // プレイヤーとの衝突判定 (極座標での簡易当たり判定)
                let angleDiff = Math.abs(player.angle - obs.angle) % (Math.PI * 2);
                if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                // 同じ軌道かつ角度が非常に近い場合
                if (Math.abs(player.currentRadius - obs.radius) < 15 && angleDiff < 0.15) {
                    // ゲームオーバー
                    gameState = 'GAMEOVER';
                    resultScore.innerText = score.toFixed(2);
                    resultRank.innerText = getRank(score);
                    gameoverScreen.classList.remove('hidden');
                }

                // 画面外（古くなったもの）の削除は今回は簡易的に角度の回転数などで無視
                if (obstacles.length > 30) {
                    obstacles.shift();
                }
            }
        }

        // 描画
        drawGameElements();

        requestAnimationFrame(loop);
    }

    function drawBackground() {
        // 軌道線
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, ORBIT_INNER, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, ORBIT_OUTER, 0, Math.PI * 2);
        ctx.stroke();

        // 中心プラネット
        ctx.fillStyle = '#0055ff';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#0055ff';
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // リセット
    }

    function drawGameElements() {
        // 障害物の描画
        obstacles.forEach(obs => {
            const x = CENTER.x + Math.cos(obs.angle) * obs.radius;
            const y = CENTER.y + Math.sin(obs.angle) * obs.radius;
            
            ctx.fillStyle = '#ff3366';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff3366';
            ctx.beginPath();
            ctx.arc(x, y, obs.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;

        // プレイヤーの描画
        const pX = CENTER.x + Math.cos(player.angle) * player.currentRadius;
        const pY = CENTER.y + Math.sin(player.angle) * player.currentRadius;

        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ffff';
        ctx.beginPath();
        // 自機っぽく三角形にする
        ctx.arc(pX, pY, player.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // ループ開始
    requestAnimationFrame(loop);
</script>

</body>
</html>
