<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Combat Preview</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: sans-serif;
    overflow: hidden;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border-radius: 8px;
  }
  input {
    width: 70px;
  }
</style>
</head>
<body>

<div id="ui">
  <div>
    SPD: <input type="number" id="spd" value="300">
    % <input type="number" id="spdP" value="0">
  </div>
  <div>
    AE: <input type="number" id="ae" value="300">
    % <input type="number" id="aeP" value="0">
  </div>
  <div>
    AS（攻撃/秒）: <input type="number" step="0.1" id="as" value="1.0">
    % <input type="number" id="asP" value="0">
  </div>
  <div>
    攻撃角度（度）: <input type="number" id="angle" value="90">
  </div>
  <p>WASD移動 / クリック移動</p>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let player = {
  x: canvas.width / 2,
  y: canvas.height / 2
};

// 入力
const spdInput = document.getElementById("spd");
const spdPInput = document.getElementById("spdP");

const aeInput = document.getElementById("ae");
const aePInput = document.getElementById("aeP");

const asInput = document.getElementById("as");
const asPInput = document.getElementById("asP");

const angleInput = document.getElementById("angle");

// キー
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// クリック移動
canvas.addEventListener("click", e => {
  player.x = e.clientX;
  player.y = e.clientY;
});

// 攻撃管理
let attackTimer = 0;
let attackProgress = 0;
let attacking = false;

let lastTime = 0;

function update(delta) {

  // ===== SPD計算 =====
  let SPD = Number(spdInput.value) || 0;
  let SPDp = Number(spdPInput.value) || 0;
  SPD *= (1 + SPDp / 100);

  const speed = SPD * 0.008;

  if (keys["w"]) player.y -= speed;
  if (keys["s"]) player.y += speed;
  if (keys["a"]) player.x -= speed;
  if (keys["d"]) player.x += speed;

  // ===== 攻撃速度 =====
  let AS = Number(asInput.value) || 1;
  let ASp = Number(asPInput.value) || 0;
  AS *= (1 + ASp / 100);

  const interval = 1 / AS;

  attackTimer += delta;

  if (attackTimer >= interval) {
    attackTimer = 0;
    attacking = true;
    attackProgress = 0;
  }

  if (attacking) {
    attackProgress += delta * 4; // モーション速度

    if (attackProgress >= 1) {
      attacking = false;
    }
  }
}

// 描画
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ===== AE計算 =====
  let AE = Number(aeInput.value) || 0;
  let AEp = Number(aePInput.value) || 0;
  AE *= (1 + AEp / 100);

  // 範囲表示
  ctx.beginPath();
  ctx.arc(player.x, player.y, AE, 0, Math.PI * 2);
  ctx.strokeStyle = "cyan";
  ctx.stroke();

  // プレイヤー
  ctx.beginPath();
  ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.fill();

  // ===== 剣モーション =====
  if (attacking) {
    let angle = Number(angleInput.value) || 90;
    let rad = angle * Math.PI / 180;

    // 振り進行
    let start = -rad/5;
    let end = start + rad * attackProgress;

    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.arc(player.x, player.y, AE, start, end);
    ctx.closePath();

    ctx.fillStyle = "rgba(255, 100, 100, 0.4)";
    ctx.fill();
  }

  // UI表示
  ctx.fillStyle = "white";
  ctx.fillText("SPD: " + spdInput.value, 20, canvas.height - 60);
  ctx.fillText("AS: " + asInput.value, 20, canvas.height - 40);
  ctx.fillText("AE: " + aeInput.value, 20, canvas.height - 20);
}

// ループ
function loop(time) {
  const delta = (time - lastTime) / 1000;
  lastTime = time;

  update(delta);
  draw();
  requestAnimationFrame(loop);
}

loop(0);
</script>

</body>
</html>
