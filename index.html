<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>レトロ・ローグライク (Dungeon Rogue)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #111; color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px; background: #000;
            border: 4px solid #333; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* ステータス画面 */
        #hud {
            background: #222; padding: 10px 15px; font-size: 14px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            border-bottom: 2px solid #444; line-height: 1.4;
        }
        .stat-line { font-weight: bold; }
        .gold { color: #ffd700; }
        .danger { color: #ff3333; }

        /* ゲーム表示画面 */
        #stage-container {
            flex: 1; background: #050505; display: flex;
            justify-content: center; align-items: center; position: relative;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            width: 90vw; height: 90vw; max-width: 380px; max-height: 380px;
            background: #111; border: 2px solid #333;
        }
        .cell {
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold;
        }
        /* セルの種類 */
        .wall { background: #2a2a2a; color: #555; }
        .floor { background: #111; color: #222; }

        /* メッセージログ */
        #log-window {
            height: 80px; background: #151515; padding: 8px 15px;
            font-size: 12px; color: #aaa; overflow-y: hidden;
            border-top: 2px solid #333; border-bottom: 2px solid #333;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .log-entry { margin-top: 2px; }
        .log-important { color: #ffcc00; }

        /* コントローラー（スマホ用） */
        #controls {
            padding: 15px; background: #222; display: flex;
            justify-content: center; align-items: center;
        }
        .pad-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 180px;
        }
        .btn {
            background: #444; border: none; color: #fff; font-size: 20px;
            font-weight: bold; padding: 15px 0; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px #222; text-align: center;
        }
        .btn:active { background: #555; transform: translateY(2px); box-shadow: 0 2px #222; }
        .btn-center { background: #333; font-size: 14px; padding: 18px 0;}

        /* ゲームオーバー画面 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10; display: flex;
            flex-direction: column; justify-content: center; align-items: center; padding: 30px;
        }
        #overlay h1 { color: #ff3333; font-size: 36px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        #overlay p { color: #ccc; margin-bottom: 25px; text-align: center; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div id="phone-shell">
    <!-- ステータスUI -->
    <div id="hud">
        <div class="stat-line">階層: <span id="ui-floor">1</span> F</div>
        <div class="stat-line gold">コイン: <span id="ui-gold">0</span> G</div>
        <div class="stat-line">体力: <span id="ui-hp" class="danger">20</span>/20</div>
        <div class="stat-line">満腹度: <span id="ui-satiety">100</span>%</div>
        <div class="stat-line" style="grid-column: span 2; font-size: 11px; color: #888;">装備: <span id="ui-weapon" style="color:#00ffcc;">木の棒 (ATK:3)</span></div>
    </div>

    <!-- ゲーム盤面 -->
    <div id="stage-container">
        <div id="grid"></div>

        <!-- 死亡時オーバーレイ -->
        <div id="overlay" class="hidden">
            <h1 id="overlay-title">力尽きた</h1>
            <p id="overlay-desc"></p>
            <button class="btn" style="width: 150px; background: #ff3333;" onclick="initGame()">再挑戦</button>
        </div>
    </div>

    <!-- ログウィンドウ -->
    <div id="log-window">
        <div class="log-entry">暗いダンジョンに足を踏み入れた...</div>
    </div>

    <!-- スマホ用キーパッド -->
    <div id="controls">
        <div class="pad-grid">
            <div></div>
            <button class="btn" onclick="movePlayer(0, -1)">▲</button>
            <div></div>
            <button class="btn" onclick="movePlayer(-1, 0)">◀</button>
            <button class="btn btn-center" onclick="movePlayer(0, 0)">パス</button>
            <button class="btn" onclick="movePlayer(1, 0)">▶</button>
            <div></div>
            <button class="btn" onclick="movePlayer(0, 1)">▼</button>
            <div></div>
        </div>
    </div>
</div>

<script>
    const WIDTH = 12;
    const HEIGHT = 12;
    
    // ゲーム状態
    let player = { x: 1, y: 1, hp: 20, maxHp: 20, atk: 3, gold: 0, satiety: 100, weapon: "木の棒" };
    let currentFloor = 1;
    let dungeonMap = [];
    let enemies = [];
    let items = [];
    let isGameOver = false;

    // 絵文字の定義
    const ICONS = {
        player: "🤠",
        wall: "■",
        floor: "·",
        stair: "▰",
        gold: "💰",
        food: "🍙",
        weapon: "⚔️",
        enemy_slime: "🟢",
        enemy_goblin: "👺"
    };

    // 初期起動
    function initGame() {
        player = { x: 1, y: 1, hp: 20, maxHp: 20, atk: 3, gold: player.gold, satiety: 100, weapon: "木の棒" }; // コインだけ引き継ぎ
        if(isGameOver) { player.gold = 0; } // 完全死亡時はコインリセット
        currentFloor = 1;
        isGameOver = false;
        document.getElementById('overlay').classList.add('hidden');
        addLog("--- 新たな冒険が始まった ---");
        generateFloor();
    }

    // マップ・敵・アイテムの自動生成
    function generateFloor() {
        dungeonMap = [];
        enemies = [];
        items = [];

        // 1. 外壁とランダムな内壁の生成
        for (let y = 0; y < HEIGHT; y++) {
            dungeonMap[y] = [];
            for (let x = 0; x < WIDTH; x++) {
                if (x === 0 || x === WIDTH - 1 || y === 0 || y === HEIGHT - 1) {
                    dungeonMap[y][x] = 'wall';
                } else if (Math.random() < 0.2 && !(x === 1 && y === 1)) {
                    dungeonMap[y][x] = 'wall'; // 20%の確率で壁
                } else {
                    dungeonMap[y][x] = 'floor';
                }
            }
        }

        // プレイヤー位置初期化
        player.x = 1; player.y = 1;
        dungeonMap[1][1] = 'floor';

        // 2. 階段の設置（右下付近に強制）
        dungeonMap[HEIGHT - 2][WIDTH - 2] = 'stair';

        // 3. アイテムの散布
        for (let i = 0; i < 3; i++) {
            let rx = Math.floor(Math.random() * (WIDTH - 2)) + 1;
            let ry = Math.floor(Math.random() * (HEIGHT - 2)) + 1;
            if (dungeonMap[ry][rx] === 'floor' && !(rx === 1 && y === 1)) {
                let types = ['gold', 'food', 'weapon'];
                items.push({ x: rx, y: ry, type: types[Math.floor(Math.random() * types.length)] });
            }
        }

        // 4. 敵の配置
        let enemyCount = 1 + Math.floor(currentFloor / 2);
        for (let i = 0; i < enemyCount; i++) {
            let rx = Math.floor(Math.random() * (WIDTH - 2)) + 1;
            let ry = Math.floor(Math.random() * (HEIGHT - 2)) + 1;
            if (dungeonMap[ry][rx] === 'floor' && !(rx === 1 && ry === 1) && !(rx === WIDTH-2 && ry === HEIGHT-2)) {
                let isGoblin = Math.random() > 0.6 && currentFloor > 1;
                enemies.push({
                    x: rx, y: ry,
                    name: isGoblin ? "ゴブリン" : "スライム",
                    icon: isGoblin ? ICONS.enemy_goblin : ICONS.enemy_slime,
                    hp: isGoblin ? 8 : 4,
                    atk: isGoblin ? 4 : 2
                });
            }
        }

        updateUI();
        drawMap();
    }

    // 描画システム
    function drawMap() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');

                // ベースの地形
                if (dungeonMap[y][x] === 'wall') {
                    cell.classList.add('wall');
                    cell.innerText = ICONS.wall;
                } else {
                    cell.classList.add('floor');
                    cell.innerText = ICONS.floor;
                }

                // 階段の描画
                if (dungeonMap[y][x] === 'stair') cell.innerText = ICONS.stair;

                // アイテムの描画
                let item = items.find(i => i.x === x && i.y === y);
                if (item) {
                    if (item.type === 'gold') cell.innerText = ICONS.gold;
                    if (item.type === 'food') cell.innerText = ICONS.food;
                    if (item.type === 'weapon') cell.innerText = ICONS.weapon;
                }

                // 敵の描画
                let enemy = enemies.find(e => e.x === x && e.y === y);
                if (enemy) cell.innerText = enemy.icon;

                // プレイヤーの描画
                if (player.x === x && player.y === y) {
                    cell.innerText = ICONS.player;
                }

                grid.appendChild(cell);
            }
        }
    }

    // プレイヤーの移動と戦闘処理
    function movePlayer(dx, dy) {
        if (isGameOver) return;

        let nextX = player.x + dx;
        let nextY = player.y + dy;

        // 壁チェック
        if (dungeonMap[nextY][nextX] === 'wall') return;

        // 満腹度の消費
        if(dx !== 0 || dy !== 0) {
            player.satiety = Math.max(0, player.satiety - 1);
            if(player.satiety <= 0) {
                player.hp = Math.max(0, player.hp - 1);
                addLog("空腹でダメージを受けた！", true);
            }
        }

        // 敵との戦闘チェック
        let enemy = enemies.find(e => e.x === nextX && e.y === nextY);
        if (enemy) {
            // 攻撃
            enemy.hp -= player.atk;
            addLog(`敵に ${player.atk} のダメージ！`);
            
            if (enemy.hp <= 0) {
                addLog(`【討伐】${enemy.name}を倒した！`, false, true);
                enemies = enemies.filter(e => e !== enemy);
                player.gold += Math.floor(Math.random() * 3) + 1; // コイン獲得
            }
            
            // 敵が生きている場合は移動せず攻撃ターンを終える
            if (enemy.hp > 0) {
                enemyTurn();
                checkDeath();
                updateUI();
                drawMap();
                return;
            }
        }

        // 移動実行
        player.x = nextX;
        player.y = nextY;

        // アイテム拾いチェック
        let itemIdx = items.findIndex(i => i.x === player.x && i.y === player.y);
        if (itemIdx !== -1) {
            let item = items[itemIdx];
            if (item.type === 'gold') {
                let g = Math.floor(Math.random() * 5) + 2;
                player.gold += g;
                addLog(`コインを拾った (+${g}G)`);
            } else if (item.type === 'food') {
                player.satiety = Math.min(100, player.satiety + 40);
                addLog(`おにぎりを食べた！満腹度が回復。`);
            } else if (item.type === 'weapon') {
                let bonus = Math.floor(Math.random() * currentFloor) + 2;
                player.atk = 3 + bonus;
                player.weapon = `鋼の剣 (+${bonus})`;
                addLog(`武器を発見！攻撃力が ${player.atk} に上がった！`, false, true);
            }
            items.splice(itemIdx, 1);
        }

        // 階段チェック
        if (dungeonMap[player.y][player.x] === 'stair') {
            currentFloor++;
            addLog(`階段を降りた... 危険な ${currentFloor}F へ`, false, true);
            generateFloor();
            return;
        }

        // 敵のターン
        enemyTurn();
        checkDeath();
        updateUI();
        drawMap();
    }

    // 敵のAI（プレイヤーに近づく）
    function enemyTurn() {
        enemies.forEach(enemy => {
            let oldX = enemy.x;
            let oldY = enemy.y;

            // プレイヤーとの距離
            let diffX = player.x - enemy.x;
            let diffY = player.y - enemy.y;

            // 隣接していれば攻撃
            if (Math.abs(diffX) <= 1 && Math.abs(diffY) <= 1 && (Math.abs(diffX) + Math.abs(diffY) === 1)) {
                player.hp = Math.max(0, player.hp - enemy.atk);
                addLog(`${enemy.name}から ${enemy.atk} のダメージを受けた！`, true);
                return;
            }

            // 近づくように移動（簡易AI）
            let moveX = 0;
            let moveY = 0;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                moveX = diffX > 0 ? 1 : -1;
            } else {
                moveY = diffY > 0 ? 1 : -1;
            }

            let targetX = enemy.x + moveX;
            let targetY = enemy.y + moveY;

            // 移動先が壁、または他の敵がいなければ移動
            if (dungeonMap[targetY][targetX] !== 'wall' && !enemies.some(e => e.x === targetX && e.y === targetY) && !(targetX === player.x && targetY === player.y)) {
                enemy.x = targetX;
                enemy.y = targetY;
            }
        });
    }

    // 死亡確認
    function checkDeath() {
        if (player.hp <= 0) {
            isGameOver = true;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('overlay-title').innerText = "冒険失敗";
            document.getElementById('overlay-desc').innerText = `到達階層: ${currentFloor}F\n獲得コインはリセットされます。\n(次回開始時、ガチャ等で得たバフ用コインのみ引き継ぐ設定が可能)`;
        }
    }

    // UIテキストの更新
    function updateUI() {
        document.getElementById('ui-floor').innerText = currentFloor;
        document.getElementById('ui-gold').innerText = player.gold;
        document.getElementById('ui-hp').innerText = player.hp;
        document.getElementById('ui-satiety').innerText = player.satiety;
        document.getElementById('ui-weapon').innerText = `${player.weapon} (ATK:${player.atk})`;
    }

    // ログにテキストを追加
    function addLog(text, isDanger = false, isImportant = false) {
        const logWindow = document.getElementById('log-window');
        const entry = document.createElement('div');
        entry.classList.add('log-entry');
        if (isDanger) entry.style.color = '#ff3333';
        if (isImportant) entry.classList.add('log-important');
        entry.innerText = text;
        logWindow.appendChild(entry);

        if (logWindow.children.length > 4) {
            logWindow.removeChild(logWindow.children[0]);
        }
    }

    // キーボード操作対応
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
        if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
        if (e.key === ' ' || e.key === 'f') movePlayer(0, 0); // パス
    });

    // 初期起動実行
    initGame();
</script>

</body>
</html>
