<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MiniGame OS</title>
    <style>
        /* 共通スタイル */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #111; color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px;
            background: #000; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 4px solid #333; border-radius: 20px;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 1; background: #000;
        }
        .hidden { display: none !important; }
        .back-home-btn {
            position: absolute; top: 15px; left: 15px; z-index: 99;
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px;
        }

        /* --- 1. ホーム画面 --- */
        #home-screen {
            background: linear-gradient(135deg, #1d2671, #c33764);
            padding: 60px 20px 20px 20px;
        }
        .app-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;
        }
        .app-icon {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .app-img {
            width: 70px; height: 70px; border-radius: 18px; display: flex;
            justify-content: center; align-items: center; font-size: 35px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .app-icon:active .app-img { transform: scale(0.9); }
        .app-label { margin-top: 8px; font-size: 12px; text-align: center; text-shadow: 1px 1px 3px #000; }
        #icon-reflex { background: linear-gradient(135deg, #ff0055, #5500ff); }
        #icon-idle { background: linear-gradient(135deg, #ffcc00, #ff6600); }
        #icon-tetris { background: linear-gradient(135deg, #00ccff, #0044ff); }

        /* --- 2. 反射神経ゲーム --- */
        #reflex-screen { background: #0a0000; font-family: 'Impact', sans-serif; }
        #reflex-arena { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 20px 40px 20px; }
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.05s; }
        .warn-parry { border: 8px solid #ffcc00; box-shadow: inset 0 0 50px rgba(255,204,0,0.5); }
        .warn-dodge { border: 8px solid #ff3333; box-shadow: inset 0 0 50px rgba(255,51,51,0.5); }
        #reflex-action-panel { display: flex; width: 100%; height: 100px; background: #111; border-top: 2px solid #333; }
        .reflex-btn { flex: 1; border: none; font-size: 22px; font-weight: bold; color: #fff; cursor: pointer; }
        #r-parry { background: linear-gradient(135deg, #ffaa00, #996600); }
        #r-dodge { background: linear-gradient(135deg, #3399ff, #0044cc); }
        .dmg-popup { position: absolute; font-size: 36px; color: #fff; font-weight: 900; text-shadow: 2px 2px 0 #000; animation: dmgAnim 0.6s forwards; z-index: 6; }
        @keyframes dmgAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

        /* --- 3. 放置ゲーム --- */
        #idle-screen { background: #151d2a; padding: 60px 15px 20px 15px; }
        .idle-stats { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .idle-enemy { background: #223147; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 15px; position: relative; }
        .hp-bar { width: 100%; height: 12px; background: #444; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .hp-fill { height: 100%; background: #ff4444; width: 100%; transition: width 0.1s; }
        .shop-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .shop-item { background: #2c3a50; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .shop-btn { background: #00cc77; border: none; color: #fff; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .shop-btn:disabled { background: #555; cursor: not-allowed; }

        /* --- 4. テトリス --- */
        #tetris-screen { background: #111; padding-top: 50px; align-items: center; }
        #tetris-canvas { background: #000; border: 2px solid #444; }
        #tetris-score { font-size: 20px; margin: 10px 0; color: #00ccff; }
        .tetris-controls { width: 100%; max-width: 300px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .t-btn { background: #333; border: none; color: #fff; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; text-align: center;}
        .t-btn:active { background: #555; }
    </style>
</head>
<body>

<div id="phone-shell">

    <!-- ================= 1. ホーム画面 ================= -->
    <div id="home-screen" class="screen">
        <div class="app-grid">
            <div class="app-icon" onclick="switchScreen('reflex-screen')">
                <div class="app-img" id="icon-reflex">👺</div>
                <div class="app-label">秒殺コロシアム</div>
            </div>
            <div class="app-icon" onclick="switchScreen('idle-screen')">
                <div class="app-img" id="icon-idle">💰</div>
                <div class="app-label">無限採掘RPG</div>
            </div>
            <div class="app-icon" onclick="switchScreen('tetris-screen')">
                <div class="app-img" id="icon-tetris">🧱</div>
                <div class="app-label">テトリス</div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 反射神経ゲーム ================= -->
    <div id="reflex-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="reflex-arena">
            <div id="r-streak" style="text-align: center; font-size: 32px; color: #ffcc00;">0 KILL</div>
            <div id="flash-overlay"></div>
            
            <div style="text-align:center;">
                <div id="r-boss-name" style="color:#ff3333; margin-bottom:5px;">第1層</div>
                <div id="r-boss-visual" style="font-size:70px; transition: transform 0.05s;">👺</div>
            </div>

            <div style="text-align:center; font-size:50px;">⚔️</div>
        </div>
        <div id="reflex-action-panel">
            <button id="r-parry" class="reflex-btn" onclick="playerReflexAction('PARRY')">弾く</button>
            <button id="r-dodge" class="reflex-btn" onclick="playerReflexAction('DODGE')">避ける</button>
        </div>

        <!-- リザルト被せ -->
        <div id="r-result" class="screen hidden" style="background:rgba(0,0,0,0.95); justify-content:center; align-items:center; padding:20px; text-align:center;">
            <h1 style="color:#ff3333; font-size:40px; margin-bottom:10px;">消 滅</h1>
            <p id="r-death-reason" style="color:#ccc; margin-bottom:20px; font-size:14px; line-height:1.5;"></p>
            <button onclick="initReflexGame()" style="background:#ff3333; border:none; color:#fff; padding:12px 30px; font-size:18px; border-radius:5px; cursor:pointer;">再挑戦</button>
        </div>
    </div>

    <!-- ================= 3. 放置ゲーム ================= -->
    <div id="idle-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div class="idle-stats">
            <div style="font-size:14px; color:#aaa;">所持金</div>
            <div id="idle-gold" style="font-size:28px; color:#ffd700; font-weight:bold;">$ 0</div>
            <div id="idle-gps" style="font-size:12px; color:#00cc77;">秒間: +$0</div>
        </div>

        <div class="idle-enemy">
            <div id="idle-enemy-name" style="font-weight:bold;">スライム</div>
            <div id="idle-enemy-visual" style="font-size:45px; margin:10px 0;">💧</div>
            <div class="hp-bar"><div id="idle-hp-fill" class="hp-fill"></div></div>
        </div>

        <div class="shop-list">
            <div class="shop-item">
                <div><div>タップ攻撃力 (Lv.<span id="lvl-atk">1</span>)</div><div style="font-size:12px; color:#aaa;">威力: +<span id="val-atk">1</span></div></div>
                <button id="btn-up-atk" class="shop-btn" onclick="buyUpgrade('atk')">$ 10</button>
            </div>
            <div class="shop-item">
                <div><div>自動採掘ドリル (Lv.<span id="lvl-auto">0</span>)</div><div style="font-size:12px; color:#aaa;">毎秒: +<span id="val-auto">0</span></div></div>
                <button id="btn-up-auto" class="shop-btn" onclick="buyUpgrade('auto')">$ 50</button>
            </div>
        </div>
    </div>

    <!-- ================= 4. テトリス ================= -->
    <div id="tetris-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="tetris-score">SCORE: 0</div>
        <canvas id="tetris-canvas" width="200" height="400"></canvas>
        <div class="tetris-controls">
            <button class="t-btn" onclick="moveTetro(-1)">←</button>
            <button class="t-btn" onclick="rotateTetro()">回転</button>
            <button class="t-btn" onclick="moveTetro(1)">→</button>
            <div></div>
            <button class="t-btn" onclick="dropTetro()" style="grid-column: span 3; background:#0044ff;">落とす</button>
        </div>
    </div>

</div>

<script>
    // --- 画面切り替えシステム ---
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        
        // 各ゲームの初期化起動
        if (screenId === 'reflex-screen') initReflexGame();
        if (screenId === 'idle-screen') startIdleGame();
        if (screenId === 'tetris-screen') initTetrisGame();
    }
    function exitToHome() {
        // 全ゲームのタイマーやループを停止
        clearTimeout(reflexTimer);
        clearInterval(idleInterval);
        clearInterval(tetrisInterval);
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('home-screen').classList.remove('hidden');
    }


    // ================= 2. 反射神経ゲーム ロジック =================
    let reflexStreak = 0;
    let reflexActive = false;
    let reflexTimer = null;
    let reflexAttackType = '';
    let reflexWindowStart = 0;
    let reflexWindowDuration = 600;
    
    // 待機時間計測用
    let reflexElapsedTime = 0; 

    function initReflexGame() {
        reflexStreak = 0;
        document.getElementById('r-streak').innerText = "0 KILL";
        document.getElementById('r-result').classList.add('hidden');
        spawnReflexBoss();
    }

    function spawnReflexBoss() {
        reflexActive = true;
        document.getElementById('r-boss-name').innerText = `第 ${reflexStreak + 1} 層`;
        document.getElementById('r-boss-visual').style.transform = "scale(1)";
        document.getElementById('flash-overlay').style.opacity = '0';
        reflexWindowStart = 0;
        reflexElapsedTime = 0;

        // 最初の基本待機：2秒、3秒、5秒からランダム（ミリ秒換算）
        const baseDelays = [2000, 3000, 5000];
        let initialWait = baseDelays[Math.floor(Math.random() * baseDelays.length)];
        
        reflexElapsedTime += initialWait;
        
        // 最初のタイマーセット
        reflexTimer = setTimeout(() => {
            evaluateReflexWaitLoop();
        }, initialWait);
    }

    // 確率判定とループ
    function evaluateReflexWaitLoop() {
        if (!reflexActive) return;

        // 基本確率の定義
        let p3 = 10; // 0.3秒追加の確率
        let p2 = 25; // 0.2秒追加の確率
        let p5 = 33; // 0.5秒追加の確率
        let p7 = 15; // 0.7秒追加の確率

        // 秒数超過による減算処理
        let currentSeconds = reflexElapsedTime / 1000;
        if (currentSeconds > 9) {
            // 9秒超越：合計30%分ダウン
            p3 = Math.max(0, p3 - 30); p2 = Math.max(0, p2 - 30); p5 = Math.max(0, p5 - 30); p7 = Math.max(0, p7 - 30);
        } else if (currentSeconds > 6) {
            // 6秒超越：10%分ダウン
            p3 = Math.max(0, p3 - 10); p2 = Math.max(0, p2 - 10); p5 = Math.max(0, p5 - 10); p7 = Math.max(0, p7 - 10);
        }
        
        // 9秒越え以降、1秒経過するごとに現在の確率からさらに10%分ずつダウン
        if (currentSeconds > 9) {
            let overSeconds = Math.floor(currentSeconds - 9);
            let deduction = overSeconds * 10;
            p3 = Math.max(0, p3 - deduction); p2 = Math.max(0, p2 - deduction); p5 = Math.max(0, p5 - deduction); p7 = Math.max(0, p7 - deduction);
        }

        // 乱数ロール (0〜100)
        let roll = Math.random() * 100;
        let nextWait = 0;

        if (roll < p3) {
            nextWait = 300; // 0.3秒
        } else if (roll < p3 + p2) {
            nextWait = 200; // 0.2秒
        } else if (roll < p3 + p2 + p5) {
            nextWait = 500; // 0.5秒
        } else if (roll < p3 + p2 + p5 + p7) {
            nextWait = 700; // 0.7秒
        }

        // どの確率にも属さない、または次の待機が0の場合 ＝ 敵の攻撃を行う
        if (nextWait === 0) {
            triggerReflexAttack();
        } else {
            // 待機時間を加算して再ループ
            reflexElapsedTime += nextWait;
            reflexTimer = setTimeout(() => {
                evaluateReflexWaitLoop();
            }, nextWait);
        }
    }

    function triggerReflexAttack() {
        reflexAttackType = Math.random() > 0.5 ? 'PARRY' : 'DODGE';
        reflexWindowDuration = Math.max(150, 550 - (reflexStreak * 25));

        const flash = document.getElementById('flash-overlay');
        flash.className = '';
        flash.classList.add(reflexAttackType === 'PARRY' ? 'warn-parry' : 'warn-dodge');
        flash.style.opacity = '1';
        document.getElementById('r-boss-visual').style.transform = "scale(1.3) translateY(10px)";

        reflexWindowStart = performance.now();

        // 制限時間内に押せないと死亡
        reflexTimer = setTimeout(() => {
            reflexDie(`敵の容赦ない一撃！\n(溜め時間: ${(reflexElapsedTime/1000).toFixed(2)}秒に対応できず遅れた)`);
        }, reflexWindowDuration);
    }

    function playerReflexAction(type) {
        if (!reflexActive) return;

        if (reflexWindowStart === 0) {
            reflexDie("フライングお手付き！\n敵がまだ攻撃を繰り出す前のフェイントに引っかかった。");
            return;
        }

        clearTimeout(reflexTimer);
        const reaction = (performance.now() - reflexWindowStart).toFixed(0);

        if (type === reflexAttackType) {
            reflexActive = false;
            reflexStreak++;
            document.getElementById('r-streak').innerText = `${reflexStreak} KILL`;
            
            // ポップアップ演出
            const p = document.createElement('div');
            p.classList.add('dmg-popup');
            p.innerText = "CRITICAL!!";
            p.style.left = "40%"; p.style.top = "40%";
            document.getElementById('reflex-arena').appendChild(p);
            setTimeout(() => p.remove(), 600);

            setTimeout(spawnReflexBoss, 1000);
        } else {
            reflexDie(`対応ミス！\nボタンの選択を間違えた。\n(反応速度: ${reaction}ms)`);
        }
    }

    function reflexDie(reason) {
        reflexActive = false;
        clearTimeout(reflexTimer);
        document.getElementById('r-death-reason').innerText = `${reason}\n\n戦績: ${reflexStreak} KILL`;
        document.getElementById('r-result').classList.remove('hidden');
    }


    // ================= 3. 放置ゲーム ロジック =================
    let idleGold = 0;
    let idleAtkLvl = 1;
    let idleAutoLvl = 0;
    let enemyMaxHp = 10;
    let enemyHp = 10;
    let idleInterval = null;

    const idleEnemies = [
        { name: "ブロンズ鉱石", emoji: "🪨" },
        { name: "シルバー原石", emoji: "🪙" },
        { name: "ゴールド金塊", emoji: "👑" },
        { name: "クリスタル大結晶", emoji: "💎" }
    ];
    let currentEnemyIdx = 0;

    function startIdleGame() {
        clearInterval(idleInterval);
        updateIdleUI();
        
        // 1秒に1回の自動処理ループ
        idleInterval = setInterval(() => {
            let gps = idleAutoLvl * 2; // レベルごとに毎秒2ゴールド
            if (gps > 0) {
                damageEnemy(gps);
            }
            updateIdleUI();
        }, 1000);

        // タップによる攻撃判定を敵エリアに付与
        document.getElementById('idle-enemy-visual').onclick = () => {
            damageEnemy(idleAtkLvl);
            updateIdleUI();
        };
    }

    function damageEnemy(amount) {
        enemyHp -= amount;
        if (enemyHp <= 0) {
            // 敵討伐、報酬獲得
            let reward = enemyMaxHp * 0.5;
            idleGold += reward;
            
            // 次の敵へ
            currentEnemyIdx = (currentEnemyIdx + 1) % idleEnemies.length;
            enemyMaxHp = Math.floor(enemyMaxHp * 1.4) + 5;
            enemyHp = enemyMaxHp;
            
            document.getElementById('idle-enemy-name').innerText = idleEnemies[currentEnemyIdx].name;
            document.getElementById('idle-enemy-visual').innerText = idleEnemies[currentEnemyIdx].emoji;
        }
    }

    function buyUpgrade(type) {
        if (type === 'atk') {
            let cost = idleAtkLvl * 10;
            if (idleGold >= cost) {
                idleGold -= cost;
                idleAtkLvl++;
            }
        } else {
            let cost = (idleAutoLvl + 1) * 50;
            if (idleGold >= cost) {
                idleGold -= cost;
                idleAutoLvl++;
            }
        }
        updateIdleUI();
    }

    function updateIdleUI() {
        document.getElementById('idle-gold').innerText = `$ ${Math.floor(idleGold)}`;
        document.getElementById('idle-gps').innerText = `秒間自動: +$${idleAutoLvl * 2}`;
        
        document.getElementById('lvl-atk').innerText = idleAtkLvl;
        document.getElementById('val-atk').innerText = idleAtkLvl;
        document.getElementById('btn-up-atk').innerText = `$ ${idleAtkLvl * 10}`;
        document.getElementById('btn-up-atk').disabled = idleGold < (idleAtkLvl * 10);

        document.getElementById('lvl-auto').innerText = idleAutoLvl;
        document.getElementById('val-auto').innerText = idleAutoLvl * 2;
        document.getElementById('btn-up-auto').innerText = `$ ${(idleAutoLvl + 1) * 50}`;
        document.getElementById('btn-up-auto').disabled = idleGold < ((idleAutoLvl + 1) * 50);

        let hpPercent = Math.max(0, (enemyHp / enemyMaxHp) * 100);
        document.getElementById('idle-hp-fill').style.width = `${hpPercent}%`;
    }


    // ================= 4. テトリス ロジック =================
    const tCanvas = document.getElementById('tetris-canvas');
    const tCtx = tCanvas.getContext('2d');
    const ROW = 20; const COL = 10; const SQ = 20;
    let tetrisScore = 0;
    let tetrisBoard = [];
    let tetrisInterval = null;
    let currentPiece = null;

    const PIECES = [
        [[1,1,1,1]], // I
        [[1,1,1],[0,1,0]], // T
        [[1,1,1],[1,0,0]], // L
        [[1,1,0],[0,1,1]], // Z
        [[1,1],[1,1]] // O
    ];
    const COLORS = ["#00ffff", "#aa00ff", "#ffaa00", "#ff0000", "#00ff00"];

    function initTetrisGame() {
        tetrisScore = 0;
        document.getElementById('tetris-score').innerText = "SCORE: 0";
        tetrisBoard = Array.from({length: ROW}, () => Array(COL).fill(0));
        clearInterval(tetrisInterval);
        spawnTetro();
        drawBoard();
        
        tetrisInterval = setInterval(() => {
            if (!moveTetro(0, 1)) {
                lockTetro();
            }
        }, 800);
    }

    function drawBoard() {
        tCtx.fillStyle = "#000"; tCtx.fillRect(0,0,tCanvas.width,tCanvas.height);
        for(let r=0; r<ROW; r++) {
            for(let c=0; c<COL; c++) {
                if(tetrisBoard[r][c]) {
                    tCtx.fillStyle = tetrisBoard[r][c];
                    tCtx.fillRect(c*SQ, r*SQ, SQ-1, SQ-1);
                }
            }
        }
        if(currentPiece) drawPiece();
    }

    function spawnTetro() {
        let id = Math.floor(Math.random() * PIECES.length);
        currentPiece = { matrix: PIECES[id], color: COLORS[id], x: 3, y: 0 };
        // 初期位置で衝突したらゲームオーバー
        if(checkCollision(0, 0, currentPiece.matrix)) {
            clearInterval(tetrisInterval);
            alert("GAME OVER! スコア: " + tetrisScore);
            exitToHome();
        }
    }

    function drawPiece() {
        tCtx.fillStyle = currentPiece.color;
        currentPiece.matrix.forEach((row, r) => {
            row.forEach((v, c) => {
                if(v) tCtx.fillRect((currentPiece.x + c)*SQ, (currentPiece.y + r)*SQ, SQ-1, SQ-1);
            });
        });
    }

    function checkCollision(dx, dy, matrix) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[r].length; c++) {
                if(!matrix[r][c]) continue;
                let nx = currentPiece.x + c + dx;
                let ny = currentPiece.y + r + dy;
                if(nx < 0 || nx >= COL || ny >= ROW) return true;
                if(ny >= 0 && tetrisBoard[ny][nx]) return true;
            }
        }
        return false;
    }

    function moveTetro(dx, dy = 0) {
        if(!checkCollision(dx, dy, currentPiece.matrix)) {
            currentPiece.x += dx; currentPiece.y += dy;
            drawBoard();
            return true;
        }
        return false;
    }

    function rotateTetro() {
        let m = currentPiece.matrix;
        let r = m[0].map((_, i) => m.map(row => row[i]).reverse());
        if(!checkCollision(0, 0, r)) { currentPiece.matrix = r; drawBoard(); }
    }

    function dropTetro() {
        while(moveTetro(0, 1)) {}
        lockTetro();
    }

    function lockTetro() {
        currentPiece.matrix.forEach((row, r) => {
            row.forEach((v, c) => {
                if(v) tetrisBoard[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
            });
        });
        // ライン消去
        for(let r=ROW-1; r>=0; r--) {
            if(tetrisBoard[r].every(v => v !== 0)) {
                tetrisBoard.splice(r, 1);
                tetrisBoard.unshift(Array(COL).fill(0));
                tetrisScore += 100; r++;
            }
        }
        document.getElementById('tetris-score').innerText = "SCORE: " + tetrisScore;
        spawnTetro();
        drawBoard();
    }

    // パソコンのキーボード操作対応
    window.addEventListener('keydown', (e) => {
        if (document.getElementById('tetris-screen').classList.contains('hidden')) return;
        if(e.key === 'ArrowLeft') moveTetro(-1);
        if(e.key === 'ArrowRight') moveTetro(1);
        if(e.key === 'ArrowUp') rotateTetro();
        if(e.key === 'ArrowDown') moveTetro(0, 1);
    });
</script>
