<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LEGACY OF HEROES</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top,#222244,#050505 70%);
  z-index:-1;
}

header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #333;
}

header h1{
  color:gold;
  letter-spacing:3px;
}

.currency{
  display:flex;
  gap:20px;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
}

nav button{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  background:#1d1d1d;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

nav button:hover{
  background:gold;
  color:black;
}

.screen{
  display:none;
  padding:20px;
}

.active{
  display:block;
}

.hero{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:25px;
  padding:40px;
  text-align:center;
  margin-top:20px;
  backdrop-filter:blur(10px);
}

.hero h2{
  font-size:3rem;
  margin-bottom:20px;
}

.main-btn{
  margin-top:25px;
  padding:16px 40px;
  border:none;
  border-radius:16px;
  background:linear-gradient(45deg,gold,orange);
  color:black;
  font-size:1.2rem;
  font-weight:bold;
  cursor:pointer;
}

.gacha-area{
  text-align:center;
  margin-top:30px;
}

.result-card{
  margin-top:30px;
  background:rgba(255,255,255,0.06);
  border-radius:20px;
  padding:25px;
  display:inline-block;
  min-width:300px;
  animation:fade 0.5s;
}

.character-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-top:30px;
}

.character-card{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.character-card h3{
  color:gold;
  margin-bottom:10px;
}

.battle-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.timer{
  color:red;
  font-size:1.4rem;
}

.battle-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:350px;
}

.team-side,
.enemy-side{
  width:45%;
}

.fighter,
.enemy{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
}

.hp-bar{
  width:100%;
  height:18px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.hp-fill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,lime,green);
}

.dead{
  opacity:0.3;
  filter:grayscale(100%);
}

.retreat-area{
  text-align:center;
  margin-top:30px;
}

.retreat-btn{
  width:280px;
  height:80px;
  border:none;
  border-radius:20px;
  background:crimson;
  color:white;
  font-size:1.3rem;
  font-weight:bold;
}

.retreat-bar{
  width:300px;
  height:25px;
  background:#222;
  border-radius:20px;
  margin:20px auto;
  overflow:hidden;
}

.retreat-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,red,orange);
}

#danger{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:100;
}

#danger h1{
  font-size:6rem;
  color:red;
  animation:pulse 0.5s infinite;
}

#danger h2{
  margin-top:20px;
  font-size:3rem;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.1);
  }

  100%{
    transform:scale(1);
  }

}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

</style>
</head>
<body>

<header>

<h1>LEGACY OF HEROES</h1>

<div class="currency">
  <span>💎3000</span>
  <span>🎫125</span>
</div>

</header>

<nav>

<button onclick="showScreen('home')">
ホーム
</button>

<button onclick="showScreen('gacha')">
ガチャ
</button>

<button onclick="showScreen('characters')">
キャラ
</button>

<button onclick="showScreen('battle')">
戦闘
</button>

</nav>

<!-- HOME -->

<section id="home" class="screen active">

<div class="hero">

<h2>命を持ち帰れ。</h2>

<p>
キャラは有限。<br>
死亡するとロスト。
</p>

<button class="main-btn" onclick="showScreen('gacha')">
ガチャへ
</button>

</div>

</section>

<!-- GACHA -->

<section id="gacha" class="screen">

<h2>キャラガチャ</h2>

<div class="gacha-area">

<button class="main-btn" onclick="pullCharacter()">
召喚する
</button>

<div id="gacha-result"></div>

</div>

</section>

<!-- CHARACTERS -->

<section id="characters" class="screen">

<h2>キャラクター一覧</h2>

<div id="character-list" class="character-grid"></div>

</section>

<!-- BATTLE -->

<section id="battle" class="screen">

<div class="battle-header">

<div>第1遠征区域</div>

<div class="timer" id="timer">
00:00
</div>

</div>

<div class="battle-area">

<div class="team-side">

<div class="fighter" id="ally1">

<h3>アレクサンダー</h3>

<div class="hp-bar">
<div class="hp-fill"></div>
</div>

</div>

<div class="fighter" id="ally2">

<h3>ニュートン</h3>

<div class="hp-bar">
<div class="hp-fill"></div>
</div>

</div>

<div class="fighter" id="ally3">

<h3>コロンブス</h3>

<div class="hp-bar">
<div class="hp-fill"></div>
</div>

</div>

</div>

<div class="enemy-side">

<div class="enemy">

<h2>敵部隊</h2>

</div>

</div>

</div>

<div class="retreat-area">

<button
class="retreat-btn"
onmousedown="startRetreat()"
onmouseup="cancelRetreat()"
ontouchstart="startRetreat()"
ontouchend="cancelRetreat()"
>
長押しで撤退
</button>

<div class="retreat-bar">

<div
class="retreat-fill"
id="retreat-fill"
></div>

</div>

</div>

</section>

<div id="danger">

<h1>DANGER</h1>

<h2>撤退完了</h2>

</div>

<script>

const screens =
document.querySelectorAll(".screen");

function showScreen(id){

  screens.forEach(screen=>{

    screen.classList.remove("active");

  });

  document
  .getElementById(id)
  .classList.add("active");

}

const characters = [

{
name:"アレクサンダー大王",
attribute:"武勇",
rarity:"SSR"
},

{
name:"アイザック・ニュートン",
attribute:"知識",
rarity:"SSR"
},

{
name:"クリストファー・コロンブス",
attribute:"探索",
rarity:"SSR"
},

{
name:"ジャンヌ・ダルク",
attribute:"信仰",
rarity:"SSR"
},

{
name:"ニコラ・テスラ",
attribute:"革命",
rarity:"SSR"
},

{
name:"レオナルド・ダ・ヴィンチ",
attribute:"知識",
rarity:"SSR"
}

];

const ownedCharacters = [];

function pullCharacter(){

const result =
characters[
Math.floor(
Math.random()*characters.length
)
];

ownedCharacters.push(result);

document.getElementById(
"gacha-result"
).innerHTML = `

<div class="result-card">

<h2>${result.rarity}</h2>

<h1>${result.name}</h1>

<p>属性：${result.attribute}</p>

<p>
新たな英雄が召喚されました。
</p>

</div>

`;

renderCharacters();

}

function renderCharacters(){

const list =
document.getElementById(
"character-list"
);

list.innerHTML = "";

ownedCharacters.forEach(character=>{

list.innerHTML += `

<div class="character-card">

<h3>${character.name}</h3>

<p>${character.rarity}</p>

<p>属性：${character.attribute}</p>

<button class="main-btn">
育成開始
</button>

</div>

`;

});

}

let retreatInterval = null;
let retreatProgress = 0;

function startRetreat(){

if(retreatInterval) return;

retreatInterval = setInterval(()=>{

retreatProgress += 1;

const percent =
(retreatProgress / 33.3) * 100;

document
.getElementById("retreat-fill")
.style.width = percent + "%";

if(retreatProgress >= 33.3){

clearInterval(retreatInterval);

showDanger();

}

},100);

}

function cancelRetreat(){

clearInterval(retreatInterval);

retreatInterval = null;

retreatProgress = 0;

document
.getElementById("retreat-fill")
.style.width = "0%";

}

function showDanger(){

document
.getElementById("danger")
.style.display = "flex";

setTimeout(()=>{

document
.getElementById("danger")
.style.display = "none";

retreatProgress = 0;

document
.getElementById("retreat-fill")
.style.width = "0%";

showScreen("home");

},3000);

}

let seconds = 0;

setInterval(()=>{

seconds++;

const min =
String(
Math.floor(seconds/60)
).padStart(2,"0");

const sec =
String(seconds%60)
.padStart(2,"0");

document
.getElementById("timer")
.textContent =
`${min}:${sec}`;

},1000);

setTimeout(()=>{

document
.getElementById("ally2")
.classList.add("dead");

},12000);

setTimeout(()=>{

document
.getElementById("ally3")
.classList.add("dead");

},18000);

</script>

</body>
</html>
