<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chain Blast (大連鎖爆発パズル)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #080911; color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px; background: #0e1122;
            border: 4px solid #1f2344; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,255,255,0.1);
        }
        #header {
            padding: 15px; background: #080911; border-bottom: 2px solid #1f2344;
            display: flex; justify-content: space-between; align-items: center;
        }
        #score-box { font-size: 28px; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
        #energy-box { font-size: 14px; color: #ff00ff; font-weight: bold; }
        
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #141938 0%, #080911 100%); }
        canvas { display: block; width: 100%; height: 100%; }

        /* コンボ表示 */
        #combo-ui {
            position: absolute; top: 20px; left: 0; width: 100%; text-align: center;
            font-size: 45px; font-weight: 900; color: #ffcc00;
            text-shadow: 0 0 15px rgba(255,204,0,0.8);
            pointer-events: none; transform: scale(1); transition: transform 0.05s;
            opacity: 0;
        }
        .combo-active { opacity: 1 !important; animation: pop 0.15s ease-out; }
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* ガイド表示 */
        #guide-msg {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            font-size: 13px; color: #8b949e; pointer-events: none; letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="phone-shell">
    <div id="header">
        <div>
            <div style="font-size: 11px; color: #6e7681; letter-spacing: 1px;">TOTAL SCORE</div>
            <div id="score-box">0</div>
        </div>
        <div id="energy-box">SHRINK BH: <span id="ui-energy">3</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="combo-ui">0 COMBO</div>
        <div id="guide-msg">画面をタップして「重力球」を放て！</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBox = document.getElementById('score-box');
    const uiEnergy = document.getElementById('ui-energy');
    const comboUi = document.getElementById('combo-ui');

    let score = 0;
    let energy = 3;
    let combo = 0;
    let comboTimer = 0;

    let blocks = [];
    let particles = [];
    let blackHole = null; // {x, y, radius, power, life}

    const COLORS = ['#ff3366', '#00ffff', '#ffcc00', '#00ff66', '#ff00ff'];
    const BLOCK_SIZE = 14;

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 初期ブロックを画面いっぱいに敷き詰める（物理的な山を作る）
    function initGame() {
        blocks = [];
        particles = [];
        score = 0;
        energy = 3;
        scoreBox.innerText = score;
        uiEnergy.innerText = energy;

        // 画面の下半分にランダムな色のブロックを大量配置
        let rows = 18;
        let cols = Math.floor(canvas.width / (BLOCK_SIZE * 1.5));
        let startY = canvas.height - 320;

        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                blocks.push({
                    x: (canvas.width / cols) * c + (Math.random() * 8) + 10,
                    y: startY + (r * (BLOCK_SIZE * 1.2)) + (Math.random() * 5),
                    vx: 0,
                    vy: 0,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    radius: BLOCK_SIZE / 2 + (Math.random() * 3),
                    isDead: false
                });
            }
        }
    }

    // タップでブラックホール（引力球）を発生させる
    canvas.addEventListener('pointerdown', (e) => {
        if (energy <= 0 && !blackHole) {
            // エネルギーが切れたら自動リセット
            initGame();
            return;
        }
        if (blackHole) return; // 連続撃ち制限

        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left;
        const ty = e.clientY - rect.top;

        // ブラックホール生成
        blackHole = { x: tx, y: ty, radius: 10, maxRadius: 75, life: 60, mode: 'pull' };
        energy--;
        uiEnergy.innerText = energy <= 0 ? "RESET TAP" : energy;
        combo = 0;
    });

    // 爆発エフェクトの散布
    function spawnParticles(x, y, color) {
        for(let i=0; i<12; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 5 + 3;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: color,
                alpha: 1,
                size: Math.random() * 4 + 2
            });
        }
    }

    function update() {
        // --- 1. ブラックホールの物理演算 ---
        if (blackHole) {
            if (blackHole.mode === 'pull') {
                blackHole.radius += (blackHole.maxRadius - blackHole.radius) * 0.1;
                blackHole.life--;

                // すべてのブロックを中心へ吸い寄せる
                blocks.forEach(b => {
                    let dx = blackHole.x - b.x;
                    let dy = blackHole.y - b.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 280 && dist > 5) {
                        let force = (280 - dist) * 0.015; // 近いほど強く
                        b.vx += (dx / dist) * force;
                        b.vy += (dy / dist) * force;
                    }
                });

                if (blackHole.life <= 0) {
                    blackHole.mode = 'push'; // 収縮の反動でちょっと弾く
                    blackHole.life = 10;
                }
            } else {
                blackHole.radius *= 0.7;
                blackHole.life--;
                if (blackHole.life <= 0) blackHole = null;
            }
        }

        // --- 2. ブロックの移動と摩擦・重力・壁衝突 ---
        blocks.forEach(b => {
            b.vy += 0.25; // 擬似重力
            b.vx *= 0.96; // 空気抵抗
            b.vy *= 0.96;

            b.x += b.vx;
            b.y += b.vy;

            // 画面の壁・床との当たり判定
            if (b.x < b.radius) { b.x = b.radius; b.vx *= -0.5; }
            if (b.x > canvas.width - b.radius) { b.x = canvas.width - b.radius; b.vx *= -0.5; }
            if (b.y > canvas.height - b.radius) { b.y = canvas.height - b.radius; b.vy *= -0.3; b.vx *= 0.8; }
        });

        // --- 3. ブロック同士の衝突・連鎖爆発チェック ---
        // 高速化のため簡易的な全探索
        for(let i=0; i<blocks.length; i++) {
            let b1 = blocks[i];
            if (b1.isDead) continue;

            for(let j=i+1; j<blocks.length; j++) {
                let b2 = blocks[j];
                if (b2.isDead) continue;

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let minDist = b1.radius + b2.radius;

                if (dist < minDist) {
                    // めり込み防止の押し出し
                    let overlap = minDist - dist;
                    let nx = dx / (dist || 1);
                    let ny = dy / (dist || 1);
                    b1.x -= nx * overlap * 0.5;
                    b1.y -= ny * overlap * 0.5;
                    b2.x += nx * overlap * 0.5;
                    b2.y += ny * overlap * 0.5;

                    // 反発速度の計算
                    let kx = b1.vx - b2.vx;
                    let ky = b1.vy - b2.vy;
                    let p = 2 * (nx * kx + ny * ky) / 2;
                    b1.vx -= nx * p * 0.5;
                    b1.vy -= ny * p * 0.5;
                    b2.vx += nx * p * 0.5;
                    b2.vy += ny * p * 0.5;

                    // 【超重要：バズ要素】同じ色同士がぶつかったら大爆発連鎖！
                    if (b1.color === b2.color) {
                        b1.isDead = true;
                        b2.isDead = true;
                        
                        combo++;
                        comboTimer = 45; // コンボ受付時間
                        score += combo * 10;
                        scoreBox.innerText = score;

                        // 周囲への爆風衝撃波
                        let boomX = (b1.x + b2.x) / 2;
                        let boomY = (b1.y + b2.y) / 2;
                        spawnParticles(boomX, boomY, b1.color);

                        blocks.forEach(other => {
                            if (!other.isDead) {
                                let odx = other.x - boomX;
                                let ody = other.y - boomY;
                                let odist = Math.sqrt(odx*odx + ody*ody);
                                if (odist < 90) {
                                    let force = (90 - odist) * 0.15;
                                    other.vx += (odx / (odist || 1)) * force;
                                    other.vy += (ody / (odist || 1)) * force;
                                }
                            }
                        });
                    }
                }
            }
        }

        // 死亡フラグの立ったブロックを削除
        blocks = blocks.filter(b => !b.isDead);

        // --- 4. エフェクト粒子の更新 ---
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;
        });
        particles = particles.filter(p => p.alpha > 0);

        // --- 5. コンボUIの制御 ---
        if (comboTimer > 0) {
            comboTimer--;
            comboUi.innerText = `${combo} COMBO`;
            comboUi.className = "combo-active";
            if (comboTimer === 0) comboUi.className = "";
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ブロックの描画（滑らかな円形ネオン調）
        blocks.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // パーティクルの描画
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0; // リセット

        // ブラックホールの視覚エフェクト
        if (blackHole) {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 0, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // 初回スタート
    initGame();
    loop();
</script>

</body>
</html>
