<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MiniGame OS v2</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #111; color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #phone-shell {
            position: relative; width: 100%; max-width: 450px;
            height: 100vh; max-height: 850px;
            background: #000; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 4px solid #333; border-radius: 20px;
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 1; background: #000;
        }
        .hidden { display: none !important; }
        .back-home-btn {
            position: absolute; top: 15px; left: 15px; z-index: 99;
            background: rgba(255,255,255,0.2); border: none; color: #fff;
            padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px;
        }
        .coin-header {
            position: absolute; top: 15px; right: 15px; z-index: 99;
            font-size: 14px; font-weight: bold; color: #ffcc00; background: rgba(0,0,0,0.5);
            padding: 4px 10px; border-radius: 10px; display: flex; align-items: center; gap: 4px;
        }

        /* --- 1. ホーム画面 --- */
        #home-screen {
            background: linear-gradient(135deg, #111827, #312e81);
            padding: 60px 20px 20px 20px;
        }
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-img {
            width: 70px; height: 70px; border-radius: 18px; display: flex;
            justify-content: center; align-items: center; font-size: 35px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .app-icon:active .app-img { transform: scale(0.9); }
        .app-label { margin-top: 8px; font-size: 11px; text-align: center; text-shadow: 1px 1px 2px #000; }
        #icon-reflex { background: linear-gradient(135deg, #ff0055, #5500ff); }
        #icon-idle { background: linear-gradient(135deg, #ffcc00, #ff6600); }
        #icon-tetris { background: linear-gradient(135deg, #00ccff, #0044ff); }
        #icon-shoot { background: linear-gradient(135deg, #00ffcc, #006644); }
        #icon-gacha { background: linear-gradient(135deg, #e0aaff, #6a0dad); }

        /* --- 2. 反射神経ゲーム --- */
        #reflex-screen { background: #0a0000; font-family: 'Impact', sans-serif; }
        #reflex-arena { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 70px 20px 40px 20px; }
        #flash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.05s; }
        .warn-parry { border: 8px solid #ffcc00; box-shadow: inset 0 0 50px rgba(255,204,0,0.5); }
        .warn-dodge { border: 8px solid #ff3333; box-shadow: inset 0 0 50px rgba(255,51,51,0.5); }
        #reflex-action-panel { display: flex; width: 100%; height: 100px; background: #111; border-top: 2px solid #333; }
        .reflex-btn { flex: 1; border: none; font-size: 22px; font-weight: bold; color: #fff; cursor: pointer; }
        #r-parry { background: linear-gradient(135deg, #ffaa00, #996600); }
        #r-dodge { background: linear-gradient(135deg, #3399ff, #0044cc); }
        .dmg-popup { position: absolute; font-size: 32px; color: #fff; font-weight: 900; text-shadow: 2px 2px 0 #000; animation: dmgAnim 0.6s forwards; z-index: 6; }
        @keyframes dmgAnim { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }

        /* --- 3. 放置ゲーム --- */
        #idle-screen { background: #151d2a; padding: 60px 15px 20px 15px; }
        .idle-stats { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .idle-enemy { background: #223147; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .hp-bar { width: 100%; height: 12px; background: #444; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .hp-fill { height: 100%; background: #ff4444; width: 100%; transition: width 0.1s; }
        .shop-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .shop-item { background: #2c3a50; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .shop-btn { background: #00cc77; border: none; color: #fff; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .shop-btn:disabled { background: #555; cursor: not-allowed; }

        /* --- 4. テトリス --- */
        #tetris-screen { background: #111; padding-top: 55px; align-items: center; }
        #tetris-canvas { background: #000; border: 2px solid #444; }
        .tetris-controls { width: 100%; max-width: 320px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        .t-btn { background: #333; border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; }

        /* --- 5. シューティング --- */
        #shoot-screen { background: #050510; padding-top: 55px; align-items: center; }
        #shoot-canvas { background: #000; border: 2px solid #22d3ee; display: block; cursor: crosshair; }

        /* --- 6. ガチャ＆バフ --- */
        #gacha-screen { background: #1e1b4b; padding: 60px 15px 20px 15px; }
        .buff-container { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .buff-item { font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #3b82f6; }
        #gacha-box { flex: 1; background: #312e81; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; border: 2px dashed #a78bfa; }
        #gacha-result { font-size: 20px; font-weight: bold; color: #f43f5e; text-align: center; height: 30px; }
        .gacha-btn { background: linear-gradient(135deg, #a78bfa, #6d28d9); border: none; color: #fff; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(167,139,250,0.4); }
        .gacha-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="phone-shell">
    <!-- 全画面共通コインインジケーター -->
    <div class="coin-header">🪙 コイン: <span id="global-coin-count">0</span></div>

    <!-- ================= 1. ホーム画面 ================= -->
    <div id="home-screen" class="screen">
        <div class="app-grid">
            <div class="app-icon" onclick="switchScreen('reflex-screen')">
                <div class="app-img" id="icon-reflex">👺</div>
                <div class="app-label">秒殺コロシアム</div>
            </div>
            <div class="app-icon" onclick="switchScreen('idle-screen')">
                <div class="app-img" id="icon-idle">💰</div>
                <div class="app-label">無限採掘RPG</div>
            </div>
            <div class="app-icon" onclick="switchScreen('tetris-screen')">
                <div class="app-img" id="icon-tetris">🧱</div>
                <div class="app-label">テトリス本家化</div>
            </div>
            <div class="app-icon" onclick="switchScreen('shoot-screen')">
                <div class="app-img" id="icon-shoot">🚀</div>
                <div class="app-label">インベーダー</div>
            </div>
            <div class="app-icon" onclick="switchScreen('gacha-screen')">
                <div class="app-img" id="icon-gacha">🔮</div>
                <div class="app-label">ガチャ＆バフ</div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 反射神経ゲーム ================= -->
    <div id="reflex-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="reflex-arena">
            <div id="r-streak" style="text-align: center; font-size: 32px; color: #ffcc00;">0 KILL</div>
            <div id="flash-overlay"></div>
            <div style="text-align:center;">
                <div id="r-boss-name" style="color:#ff3333; margin-bottom:5px;">第1層</div>
                <div id="r-boss-visual" style="font-size:70px; transition: transform 0.05s;">👺</div>
            </div>
            <div style="text-align:center; font-size:50px;">⚔️</div>
        </div>
        <div id="reflex-action-panel">
            <button id="r-parry" class="reflex-btn" onclick="playerReflexAction('PARRY')">弾く</button>
            <button id="r-dodge" class="reflex-btn" onclick="playerReflexAction('DODGE')">避ける</button>
        </div>
        <div id="r-result" class="screen hidden" style="background:rgba(0,0,0,0.95); justify-content:center; align-items:center; padding:20px; text-align:center; z-index:100;">
            <h1 style="color:#ff3333; font-size:40px; margin-bottom:10px;">消 滅</h1>
            <p id="r-death-reason" style="color:#ccc; margin-bottom:20px; font-size:14px; line-height:1.5;"></p>
            <button onclick="initReflexGame()" style="background:#ff3333; border:none; color:#fff; padding:12px 30px; font-size:18px; border-radius:5px; cursor:pointer;">再挑戦</button>
        </div>
    </div>

    <!-- ================= 3. 放置ゲーム ================= -->
    <div id="idle-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div class="idle-stats">
            <div style="font-size:13px; color:#aaa;">所持金</div>
            <div id="idle-gold" style="font-size:24px; color:#ffd700; font-weight:bold;">$ 0</div>
            <div id="idle-gps" style="font-size:11px; color:#00cc77;">自動: +$0/秒</div>
        </div>
        <div class="idle-enemy">
            <div id="idle-enemy-name" style="font-weight:bold;">スライム</div>
            <div id="idle-enemy-visual" style="font-size:45px; margin:10px 0; cursor:pointer;">💧</div>
            <div class="hp-bar"><div id="idle-hp-fill" class="hp-fill"></div></div>
        </div>
        <div class="shop-list">
            <div class="shop-item">
                <div><div>クリッカー (Lv.<span id="lvl-atk">1</span>)</div><div style="font-size:11px; color:#aaa;">威力: +<span id="val-atk">1</span></div></div>
                <button id="btn-up-atk" class="shop-btn" onclick="buyUpgrade('atk')">$ 10</button>
            </div>
            <div class="shop-item">
                <div><div>自動ドリル (Lv.<span id="lvl-auto">0</span>)</div><div style="font-size:11px; color:#aaa;">毎秒: +<span id="val-auto">0</span></div></div>
                <button id="btn-up-auto" class="shop-btn" onclick="buyUpgrade('auto')">$ 50</button>
            </div>
        </div>
    </div>

    <!-- ================= 4. テトリス ================= -->
    <div id="tetris-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="tetris-score" style="font-size: 18px; margin-bottom: 5px; color: #00ccff;">SCORE: 0</div>
        <canvas id="tetris-canvas" width="220" height="440"></canvas>
        <div class="tetris-controls">
            <button class="t-btn" onclick="moveTetro(-1)">←</button>
            <button class="t-btn" onclick="rotateTetro(1)">右回転</button>
            <button class="t-btn" onclick="rotateTetro(-1)">左回転</button>
            <button class="t-btn" onclick="moveTetro(1)">→</button>
            <button class="t-btn" onclick="moveTetro(0, 1)" style="grid-column: span 2; background:#444;">下加速</button>
            <button class="t-btn" onclick="dropTetro()" style="grid-column: span 2; background:#0044ff;">即落下</button>
        </div>
    </div>

    <!-- ================= 5. シューティング ================= -->
    <div id="shoot-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div id="shoot-score" style="font-size: 18px; margin-bottom: 5px; color: #00ffcc;">SCORE: 0</div>
        <canvas id="shoot-canvas" width="360" height="500"></canvas>
        <div id="shoot-result" class="screen hidden" style="background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:100;">
            <h2 style="color:#ff3333; font-size:32px; margin-bottom:15px;">撃沈</h2>
            <button onclick="initShootGame()" style="background:#00ffcc; color:#000; border:none; padding:12px 30px; font-size:16px; font-weight:bold; border-radius:5px; cursor:pointer;">リトライ</button>
        </div>
    </div>

    <!-- ================= 6. ガチャ＆バフ ================= -->
    <div id="gacha-screen" class="screen hidden">
        <button class="back-home-btn" onclick="exitToHome()">ホーム</button>
        <div style="font-size:16px; font-weight:bold; margin-bottom:8px; color:#a78bfa;">永久パッシブバフ効果</div>
        <div class="buff-container">
            <div class="buff-item"><span>🧱 テトリス: スコア倍率</span><span>Lv.<span id="bf-tetris">0</span> (+<span id="bf-tetris-v">0</span>%)</span></div>
            <div class="buff-item"><span>👺 反射神経: 敵の追加待機</span><span>Lv.<span id="bf-reflex">0</span> (+<span id="bf-reflex-v">0</span>.0s)</span></div>
            <div class="buff-item"><span>💰 放置RPG: オフライン進行</span><span>Lv.<span id="bf-idle">0</span> (<span id="bf-idle-v">不活性</span>)</span></div>
            <div class="buff-item"><span>🚀 シューティング: 連射速度</span><span>Lv.<span id="bf-shoot">0</span> (+<span id="bf-shoot-v">0</span>%)</span></div>
        </div>
        <div id="gacha-box">
            <div id="gacha-result">何が出るかな？</div>
            <button class="gacha-btn" onclick="rollGacha()">ガチャを引く (🪙10枚)</button>
        </div>
    </div>
</div>

<script>
    // --- グローバルコアデータ（セーブ・共通経済） ---
    let globalCoins = 0;
    let offlineTimeLeft = 0; // 擬似オフライン用
    const buffs = { tetris: 0, reflex: 0, idle: 0, shoot: 0 };

    function addCoins(amount) {
        globalCoins += amount;
        document.getElementById('global-coin-count').innerText = Math.floor(globalCoins);
    }

    function switchScreen(screenId) {
        // 全ループ停止
        clearTimeout(reflexTimer);
        clearInterval(idleInterval);
        clearInterval(tetrisInterval);
        clearInterval(shootInterval);

        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        
        if (screenId === 'reflex-screen') initReflexGame();
        if (screenId === 'idle-screen') startIdleGame();
        if (screenId === 'tetris-screen') initTetrisGame();
        if (screenId === 'shoot-screen') initShootGame();
        if (screenId === 'gacha-screen') updateBuffUI();
    }

    function exitToHome() {
        // 放置RPGからホームへ抜ける際、オフラインバフがあれば蓄積開始
        if (currentScreen === 'idle-screen' && buffs.idle > 0) {
            // ホームにいてもバックグラウンドで動くフラグ
        }
        currentScreen = 'home-screen';
        switchScreen('home-screen');
    }
    let currentScreen = 'home-screen';


    // ================= 2. 反射神経ゲーム（精密改修版） =================
    let reflexStreak = 0, reflexActive = false, reflexTimer = null, reflexAttackType = '', reflexWindowStart = 0, reflexWindowDuration = 600, reflexElapsedTime = 0;
    function initReflexGame() {
        reflexStreak = 0;
        document.getElementById('r-streak').innerText = "0 KILL";
        document.getElementById('r-result').classList.add('hidden');
        spawnReflexBoss();
    }
    function spawnReflexBoss() {
        reflexActive = true;
        document.getElementById('r-boss-name').innerText = `第 ${reflexStreak + 1} 層`;
        document.getElementById('r-boss-visual').style.transform = "scale(1)";
        document.getElementById('flash-overlay').style.opacity = '0';
        reflexWindowStart = 0; reflexElapsedTime = 0;

        const baseDelays = [2000, 3000, 5000];
        let initialWait = baseDelays[Math.floor(Math.random() * baseDelays.length)];
        
        // 【バフ適用】：ガチャバフLvに応じて敵の最初の待機時間を引き伸ばす
        initialWait += (buffs.reflex * 300);

        reflexElapsedTime += initialWait;
        reflexTimer = setTimeout(evaluateReflexWaitLoop, initialWait);
    }
    function evaluateReflexWaitLoop() {
        if (!reflexActive) return;
        let p3 = 10, p2 = 25, p5 = 33, p7 = 15;
        let currentSeconds = reflexElapsedTime / 1000;

        if (currentSeconds > 9) {
            let over = Math.floor(currentSeconds - 9);
            let sub = 30 + (over * 10);
            p3 = Math.max(0, p3 - sub); p2 = Math.max(0, p2 - sub); p5 = Math.max(0, p5 - sub); p7 = Math.max(0, p7 - sub);
        } else if (currentSeconds > 6) {
            p3 = Math.max(0, p3 - 10); p2 = Math.max(0, p2 - 10); p5 = Math.max(0, p5 - 10); p7 = Math.max(0, p7 - 10);
        }

        let roll = Math.random() * 100;
        let nextWait = 0;
        if (roll < p3) nextWait = 300;
        else if (roll < p3 + p2) nextWait = 200;
        else if (roll < p3 + p2 + p5) nextWait = 500;
        else if (roll < p3 + p2 + p5 + p7) nextWait = 700;

        if (nextWait === 0) {
            triggerReflexAttack();
        } else {
            reflexElapsedTime += nextWait;
            reflexTimer = setTimeout(evaluateReflexWaitLoop, nextWait);
        }
    }
    function triggerReflexAttack() {
        reflexAttackType = Math.random() > 0.5 ? 'PARRY' : 'DODGE';
        reflexWindowDuration = Math.max(150, 550 - (reflexStreak * 25));
        const flash = document.getElementById('flash-overlay');
        flash.className = '';
        flash.classList.add(reflexAttackType === 'PARRY' ? 'warn-parry' : 'warn-dodge');
        flash.style.opacity = '1';
        document.getElementById('r-boss-visual').style.transform = "scale(1.2) translateY(10px)";
        reflexWindowStart = performance.now();
        reflexTimer = setTimeout(() => {
            reflexDie("反応が遅すぎた！敵の一撃が炸裂。");
        }, reflexWindowDuration);
    }
    function playerReflexAction(type) {
        if (!reflexActive) return;
        if (reflexWindowStart === 0) { reflexDie("フライング自滅！フェイントに引っかかった。"); return; }
        clearTimeout(reflexTimer);
        if (type === reflexAttackType) {
            reflexActive = false; reflexStreak++;
            document.getElementById('r-streak').innerText = `${reflexStreak} KILL`;
            addCoins(1); // 1キル＝1コイン
            setTimeout(spawnReflexBoss, 800);
        } else {
            reflexDie("防御行動を間違えた！");
        }
    }
    function reflexDie(reason) {
        reflexActive = false; clearTimeout(reflexTimer);
        document.getElementById('r-death-reason').innerText = `${reason}\n戦績: ${reflexStreak} KILL\n🪙 コイン1枚を獲得！`;
        addCoins(1); // 参加賞
        document.getElementById('r-result').classList.remove('hidden');
    }


    // ================= 3. 放置ゲーム =================
    let idleGold = 0, idleAtkLvl = 1, idleAutoLvl = 0, enemyMaxHp = 10, enemyHp = 10, idleInterval = null;
    const idleEnemies = [
        { name: "泥スラ原石", emoji: "🪨" }, { name: "鉄クズ塊", emoji: "⚙️" },
        { name: "サファイア鉱", emoji: "💎" }, { name: "古代金結晶", emoji: "👑" }
    ];
    let enemyIdx = 0;
    function startIdleGame() {
        clearInterval(idleInterval);
        updateIdleUI();
        idleInterval = setInterval(() => {
            let dps = idleAutoLvl * 2;
            if (dps > 0) damageEnemy(dps);
            updateIdleUI();
        }, 1000);
        document.getElementById('idle-enemy-visual').onclick = () => {
            damageEnemy(idleAtkLvl);
            updateIdleUI();
        };
    }
    // バックグラウンド常時進行（オフラインバフ効果：ホーム等にいても1秒ごとに10%分配給）
    setInterval(() => {
        if (currentScreen !== 'idle-screen' && buffs.idle > 0 && idleAutoLvl > 0) {
            let passiveDps = (idleAutoLvl * 2) * (buffs.idle * 0.1);
            damageEnemy(passiveDps);
        }
    }, 1000);

    function damageEnemy(amt) {
        enemyHp -= amt;
        if (enemyHp <= 0) {
            idleGold += enemyMaxHp * 0.6;
            addCoins(1); // 1体撃破ごとに1コイン
            enemyIdx = (enemyIdx + 1) % idleEnemies.length;
            enemyMaxHp = Math.floor(enemyMaxHp * 1.35) + 6;
            enemyHp = enemyMaxHp;
            document.getElementById('idle-enemy-name').innerText = idleEnemies[enemyIdx].name;
            document.getElementById('idle-enemy-visual').innerText = idleEnemies[enemyIdx].emoji;
        }
    }
    function buyUpgrade(type) {
        if (type === 'atk') {
            let cost = idleAtkLvl * 10;
            if (idleGold >= cost) { idleGold -= cost; idleAtkLvl++; }
        } else {
            let cost = (idleAutoLvl + 1) * 50;
            if (idleGold >= cost) { idleGold -= cost; idleAutoLvl++; }
        }
        updateIdleUI();
    }
    function updateIdleUI() {
        document.getElementById('idle-gold').innerText = `$ ${Math.floor(idleGold)}`;
        document.getElementById('idle-gps').innerText = `自動: +$${idleAutoLvl * 2}/秒`;
        document.getElementById('lvl-atk').innerText = idleAtkLvl;
        document.getElementById('val-atk').innerText = idleAtkLvl;
        document.getElementById('btn-up-atk').innerText = `$ ${idleAtkLvl * 10}`;
        document.getElementById('btn-up-atk').disabled = idleGold < (idleAtkLvl * 10);
        document.getElementById('lvl-auto').innerText = idleAutoLvl;
        document.getElementById('val-auto').innerText = idleAutoLvl * 2;
        document.getElementById('btn-up-auto').innerText = `$ ${(idleAutoLvl + 1) * 50}`;
        document.getElementById('btn-up-auto').disabled = idleGold < ((idleAutoLvl + 1) * 50);
        document.getElementById('idle-hp-fill').style.width = `${Math.max(0, (enemyHp / enemyMaxHp) * 100)}%`;
    }
